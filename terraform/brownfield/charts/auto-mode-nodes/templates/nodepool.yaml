{{- /*
Equivalent of the built-in general-purpose NodePool, pointed at the tagged NodeClass.
*/}}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.name }}
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: {{ .Values.name }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: {{ toJson .Values.instanceCategories }}
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: [{{ .Values.instanceGeneration | toString | quote }}]
        - key: kubernetes.io/arch
          operator: In
          values: {{ toJson .Values.architectures }}
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      expireAfter: 336h
      terminationGracePeriod: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
