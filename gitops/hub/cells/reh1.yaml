# Rehearsal cell for the talk: the same shape as the talk cell, in the same region.
# One object = one region. Committing this file built eu-west-1 (encabulator-reh1).
# WARNING: removing or renaming this file is a teardown. hub-cells prunes, so kro and ACK
# then delete this cell's cluster, VPC and IAM roles. It needs Carlos's explicit approval.
apiVersion: kro.run/v1alpha1
kind: EncabulatorCell
metadata:
  name: encabulator-reh1
  namespace: encabulator-cells
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  region: eu-west-1
  vpcCIDR: 10.42.0.0/16
  availabilityZones: [eu-west-1a, eu-west-1b, eu-west-1c]
  argoCDRoleName: encabulator-usw2-argocd
  adminRoleName: Admin
