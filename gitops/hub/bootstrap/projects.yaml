# Two Argo CD projects. Applications on the hub use encabulator-hub; the Applications the
# cell ApplicationSet (gitops/hub/appset.yaml) generates use encabulator-cells.
# Destinations name clusters by their Argo CD cluster name, so no cluster ARN (and no account
# id) appears in Git. The field name clusterResourceWhitelist is fixed by the Argo CD API.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: encabulator-hub
  namespace: argocd
spec:
  description: OPN315 hub cluster (encabulator-usw2) applications
  # The EKS Argo CD capability runs Argo CD outside the cluster with Applications in any
  # namespace, so a project must name the namespace its Applications live in, or every
  # Application reports "not permitted to use project". The capability's default project does
  # the same.
  sourceNamespaces:
    - argocd
  sourceRepos:
    - https://github.com/jlbutler/cloud-native-encabulator
  destinations:
    - name: encabulator-usw2
      namespace: encabulator          # brownfield ACK resources
    - name: encabulator-usw2
      namespace: encabulator-cells    # EncabulatorCell instances and what kro creates for them
    - name: encabulator-usw2
      namespace: argocd               # the cell ApplicationSet and cell cluster Secrets
  clusterResourceWhitelist:
    - group: kro.run
      kind: ResourceGraphDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: encabulator-cells
  namespace: argocd
spec:
  description: OPN315 cell clusters (one per region), deployed from the hub
  sourceNamespaces:
    - argocd
  # This repository, plus the chart repositories of the platform charts that
  # gitops/hub/appset.yaml (ApplicationSet encabulator-platform) installs on every cell.
  sourceRepos:
    - https://github.com/jlbutler/cloud-native-encabulator
    - https://prometheus-community.github.io/helm-charts
    - https://jaegertracing.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - name: encabulator-*
      namespace: encabulator
    - name: encabulator-*
      namespace: encabulator-observability
    # never the hub itself
    - name: "!encabulator-usw2"
      namespace: "*"
  clusterResourceWhitelist:
    - group: kro.run
      kind: ResourceGraphDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
    - group: eks.amazonaws.com
      kind: NodeClass
    - group: karpenter.sh
      kind: NodePool
    # kube-prometheus-stack: the Prometheus Operator CRDs and its admission webhooks
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
