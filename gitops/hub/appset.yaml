# Every cell gets the app. The cluster generator selects the Argo CD cluster Secrets that the
# EncabulatorCell RGD writes (label encabulator.io/cell=true) and renders one Application per
# cell, named after the cell (encabulator-use2) and pointed at its EKS cluster ARN.
#
# Region-specific ids travel on the cluster Secret's annotations and reach gitops/app through
# kustomize patches:
#   encabulator.io/subnet-ids                 -> Encabulator.spec.subnetIDs, NodeClass subnets
#   encabulator.io/security-group-id          -> Encabulator.spec.securityGroupID
#   encabulator.io/cluster-security-group-id  -> NodeClass security group
#   encabulator.io/registry (optional)        -> Encabulator.spec.registry, an image mirror;
#                                                absent means the RGD default (ghcr.io)
# and the cell's name gives the NodeClass its node role (<cell>-node).
#
# The Git source comes from the cell Secret too, with this repository and branch as defaults:
#   encabulator.io/repo-url (optional)        -> source.repoURL
#   encabulator.io/revision (optional)        -> source.targetRevision
# The EncabulatorCell RGD copies these two and encabulator.io/registry from the hub's own
# cluster Secret (gitops/hub/bootstrap/register-hub.sh writes them there), so every cell of a
# hub follows the repository the hub was registered with.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: encabulator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            encabulator.io/cell: "true"
  # Deleting this ApplicationSet (or a cell's registration) leaves the app running on the cell.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
      labels:
        encabulator.io/region: '{{ index .metadata.annotations "encabulator.io/region" }}'
    spec:
      project: encabulator-cells
      source:
        repoURL: '{{ index .metadata.annotations "encabulator.io/repo-url" | default "https://github.com/cloud-native-encabulator/encabulator" }}'
        targetRevision: '{{ index .metadata.annotations "encabulator.io/revision" | default "main" }}'
        path: gitops/app
        kustomize:
          patches:
            - target:
                kind: Encabulator
                name: encabulator
                namespace: encabulator
              patch: |-
                - op: add
                  path: /spec/subnetIDs
                  value: {{ splitList "," (index .metadata.annotations "encabulator.io/subnet-ids") | toJson }}
                - op: add
                  path: /spec/securityGroupID
                  value: {{ index .metadata.annotations "encabulator.io/security-group-id" | quote }}
                {{- with index .metadata.annotations "encabulator.io/registry" }}
                - op: add
                  path: /spec/registry
                  value: {{ . | quote }}
                {{- end }}
            # The cell's custom NodeClass (gitops/app/nodes/): the cell's own node role (the
            # EncabulatorCell RGD names it <cell>-node and gives it the EC2 access entry), nodes
            # in the private subnets, with the cluster security group, as on the hub.
            - target:
                group: eks.amazonaws.com
                kind: NodeClass
              patch: |-
                - op: replace
                  path: /spec/role
                  value: {{ printf "%s-node" .name | quote }}
                - op: add
                  path: /spec/subnetSelectorTerms
                  value: [{{ range $i, $id := splitList "," (index .metadata.annotations "encabulator.io/subnet-ids") }}{{ if $i }}, {{ end }}{"id": {{ $id | quote }}}{{ end }}]
                - op: add
                  path: /spec/securityGroupSelectorTerms
                  value: [{"id": {{ index .metadata.annotations "encabulator.io/cluster-security-group-id" | quote }}}]
      destination:
        server: '{{ .server }}'
        namespace: encabulator
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # A new cell's kro and ACK CRDs can still be settling on the first sync.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
---
# Every cell also gets the platform charts. One Application per entry below and per cell whose
# cluster Secret has label encabulator.io/platform-<component>=true. The EncabulatorCell RGD
# writes that label from the cell file (spec.observability, default true), so a cell opts out
# with one field and a new cell gets the same set as every other.
#
# The matrix pairs each entry with each matching cell. The cluster generator's selector is
# rendered with the entry's parameters, so one selector covers every component.
#
# Versions are the pins in platform/versions.env (`scripts/platform.sh template-cell` fails when
# they differ). Values are the hub's common files plus the cell overlay in platform/cell/.
#
# These Applications have no dependency on the app's Application and the app has none on them:
# they sync side by side. Prometheus Operator CRDs come with kube-prometheus-stack; the other
# entries' ServiceMonitors skip the dry run and retry until those CRDs exist.
#
# A cell that already runs these charts under Helm (the same release names and namespace) is
# adopted in place. Annotate its cluster Secret with encabulator.io/platform-sync=manual first,
# and the Applications are created without automated sync, so the diff can be read before the
# first sync. Remove the annotation to turn automated sync on.
#
# To add a component, add its entries, a label in the RGD's register Secret, a spec field for
# its switch, and its namespace in the encabulator-cells AppProject.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: encabulator-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # release is the Helm release name and the Application name suffix.
                - component: observability
                  release: prometheus-stack
                  namespace: encabulator-observability
                  repoURL: https://prometheus-community.github.io/helm-charts
                  chart: kube-prometheus-stack
                  version: 91.8.2
                - component: observability
                  release: jaeger
                  namespace: encabulator-observability
                  repoURL: https://jaegertracing.github.io/helm-charts
                  chart: jaeger
                  version: 4.14.0
                - component: observability
                  release: opentelemetry-collector
                  namespace: encabulator-observability
                  repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chart: opentelemetry-collector
                  version: 0.174.0
                # Not a chart: the dashboards and the services' ServiceMonitor (platform/kustomization.yaml),
                # from this repository at the cell's revision (see templatePatch).
                - component: observability
                  release: observability-config
                  namespace: encabulator-observability
                  chart: ""
          - clusters:
              selector:
                matchLabels:
                  encabulator.io/cell: "true"
                matchExpressions:
                  - key: 'encabulator.io/platform-{{ .component }}'
                    operator: In
                    values: ["true"]
  # Switching a component off, or deleting this ApplicationSet, stops managing the charts and
  # leaves them running on the cell.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}-{{ .release }}'
      labels:
        encabulator.io/region: '{{ index .metadata.annotations "encabulator.io/region" }}'
        encabulator.io/platform: '{{ .component }}'
      annotations:
        # Diff with a server-side dry-run apply: defaulted fields and fields other managers
        # own (the admission webhook caBundle, for example) do not show as drift.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: encabulator-cells
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # Grafana's chart generates the admin password when the Secret is first created and puts a
      # checksum of it on the pod template. Keep the generated value instead of a new one on
      # every render, which would also restart Grafana on every sync.
      ignoreDifferences:
        - kind: Secret
          name: prometheus-stack-grafana
          namespace: encabulator-observability
          jsonPointers:
            - /data/admin-password
        - group: apps
          kind: Deployment
          name: prometheus-stack-grafana
          namespace: encabulator-observability
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1secret
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          # The Prometheus Operator CRDs are too large for client-side apply's annotation.
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
  # The source differs between a chart and a Git folder, and automated sync is on unless the
  # cell is being adopted. No automated prune: a chart bump that drops an object (a CRD, say)
  # must not delete it, or everything that uses it, on its own. This repository's URL and
  # revision come from the cell Secret, as in the encabulator ApplicationSet above.
  templatePatch: |
    {{- $repoURL := index .metadata.annotations "encabulator.io/repo-url" | default "https://github.com/cloud-native-encabulator/encabulator" }}
    {{- $revision := index .metadata.annotations "encabulator.io/revision" | default "main" }}
    spec:
      sources:
      {{- if .chart }}
        - repoURL: {{ .repoURL }}
          chart: {{ .chart }}
          targetRevision: {{ .version | quote }}
          helm:
            releaseName: {{ .release }}
            valueFiles:
              - $values/platform/{{ .chart }}.values.yaml
              - $values/platform/cell/{{ .chart }}.values.yaml
        - repoURL: {{ $repoURL }}
          targetRevision: {{ $revision | quote }}
          ref: values
      {{- else }}
        - repoURL: {{ $repoURL }}
          targetRevision: {{ $revision | quote }}
          path: platform
      {{- end }}
    {{- if ne (index .metadata.annotations "encabulator.io/platform-sync") "manual" }}
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
    {{- end }}
