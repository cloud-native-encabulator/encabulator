# EKS Auto Mode nodes for a cell, tagged like every other demo resource (lead decision D8).
#
# The built-in node pools use the EKS-managed "default" NodeClass, which EKS reverts on every
# edit, so the instances, volumes and ENIs it launches can never carry auto-delete=no. The
# cell is created with no built-in pools; this NodeClass + NodePool replace the
# general-purpose pool. Same spec as the hub's (terraform/brownfield/charts/auto-mode-nodes).
#
# Placeholders: the cell ApplicationSet replaces role with the cell's own node role
# (<cell>-node, from the cell's name), subnetSelectorTerms (from the cluster Secret
# annotation encabulator.io/subnet-ids) and securityGroupSelectorTerms (from
# encabulator.io/cluster-security-group-id) with kustomize patches.
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: encabulator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Created by the EncabulatorCell RGD on the hub. Replaced per cell by the ApplicationSet.
  role: encabulator-use2-node
  subnetSelectorTerms:
    - id: subnet-00000000000000001
    - id: subnet-00000000000000002
    - id: subnet-00000000000000003
  securityGroupSelectorTerms:
    - id: sg-00000000000000000
  # Applied to the instances, root volumes and network interfaces Auto Mode launches.
  tags:
    auto-delete: "no"
    project: encabulator
    talk: opn315
---
# Equivalent of the built-in general-purpose NodePool, pointed at the tagged NodeClass.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: encabulator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: encabulator
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: ["4"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      expireAfter: 336h
      terminationGracePeriod: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
      # Never repack a node that still runs pods. A rollout's surge pods add nodes, and
      # consolidating them afterwards moved influxdb-0 (its EBS volume re-attached on another
      # node, about 30 s down), the console and the grammeter mid-demo. Empty nodes are still
      # removed, and drift (a new Auto Mode AMI, about weekly) and expireAfter still replace
      # nodes, so node upgrades keep working. The cost is underused nodes that stay until they
      # are empty. To repack again, delete this budget.
      - nodes: "0"
        reasons: ["Underutilized"]
  limits:
    cpu: "64"
