{{/* One ClusterIP Service per enabled service. The console is also reachable through
     the optional Ingress; everything else is namespace-internal. */}}
{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := fromYaml (include "encabulator.svc" (dict "root" $ "svc" $raw)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "encabulator.namespace" $ }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" $name "plane" $svc.plane "component" "service") | nindent 4 }}
  {{- if or $svc.service.annotations $.Values.global.annotations }}
  annotations:
    {{- with $.Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $svc.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ $svc.service.type }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "encabulator.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
