{{/*
Optional Ingress for the console. The console's live feed is Server-Sent Events, which
long-lived idle-timeout defaults will happily sever, so the default annotations raise the
ALB idle timeout and disable proxy buffering for nginx.
*/}}
{{- if .Values.ingress.enabled }}
{{- $console := "encabulation-control-console" }}
{{- $raw := required "ingress.enabled requires services.encabulation-control-console" (get .Values.services $console) }}
{{- $svc := fromYaml (include "encabulator.svc" (dict "root" $ "svc" $raw)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $console }}
  namespace: {{ include "encabulator.namespace" . }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" $console "plane" "control" "component" "console") | nindent 4 }}
    {{- with .Values.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $defaultPaths := list (dict "path" "/" "pathType" "Prefix") }}
    {{- range .Values.ingress.hosts }}
    - {{ if .host }}host: {{ .host | quote }}
      {{ end }}http:
        paths:
          {{- range (default $defaultPaths .paths) }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $console }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
