{{/* One ServiceAccount per service. Token projection is off unless the workload talks
     to the Kubernetes API (the console and the malaise engine). */}}
{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := fromYaml (include "encabulator.svc" (dict "root" $ "svc" $raw)) }}
{{- if $svc.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "encabulator.namespace" $ }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" $name "plane" $svc.plane "component" "service") | nindent 4 }}
  {{- with $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $svc.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
