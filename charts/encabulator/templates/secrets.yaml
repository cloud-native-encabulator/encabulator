{{/*
Secrets are generated on first install with randAlphaNum / genPrivateKey and preserved on
upgrade with `lookup` (design section 10). `lookup` returns nothing during `helm template`,
so a rendered manifest always shows fresh values; that is expected and harmless.

Set the matching values.yaml key, or point `secrets.existingSecret` / the stores'
`external.existingSecret` at a Secret you manage yourself, to take the chart out of the
secret business entirely.
*/}}
{{- if .Values.secrets.create }}
{{- $ns := include "encabulator.namespace" . }}

{{- /* ------------------------------------------------------------- application */}}
{{- if not .Values.secrets.existingSecret }}
{{- $app := printf "%s-app" .Release.Name }}
{{- $jwtKey := .Values.secrets.app.jwtPrivateKey }}
{{- if not $jwtKey }}{{- $jwtKey = genPrivateKey "rsa" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" "encabulator-app" "plane" "" "component" "secret") | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # RS256 signing key for the unilateral phase detractor's JWTs.
  jwt-private-key: {{ include "encabulator.preserved" (dict "root" $ "secret" $app "key" "jwt-private-key" "value" $jwtKey) }}
  bootstrap-admin-password: {{ include "encabulator.preserved" (dict "root" $ "secret" $app "key" "bootstrap-admin-password" "value" (default (randAlphaNum 24) .Values.secrets.app.bootstrapAdminPassword)) }}
  bootstrap-operator-password: {{ include "encabulator.preserved" (dict "root" $ "secret" $app "key" "bootstrap-operator-password" "value" (default (randAlphaNum 24) .Values.secrets.app.bootstrapOperatorPassword)) }}
  # Console BFF session cookie signing key.
  session-secret: {{ include "encabulator.preserved" (dict "root" $ "secret" $app "key" "session-secret" "value" (default (randAlphaNum 48) .Values.secrets.app.sessionSecret)) }}
  # The grammeter derives every synthetic customer's password from this seed.
  customer-password-seed: {{ include "encabulator.preserved" (dict "root" $ "secret" $app "key" "customer-password-seed" "value" (default (randAlphaNum 32) .Values.secrets.app.customerPasswordSeed)) }}
{{- end }}

{{- /* ---------------------------------------------------------------- postgres */}}
{{- if not (and .Values.postgres.external.enabled .Values.postgres.external.existingSecret) }}
{{- $pg := printf "%s-postgres" .Release.Name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg }}
  namespace: {{ $ns }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" "postgres" "plane" "data" "component" "secret") | nindent 4 }}
type: Opaque
data:
  {{ .Values.postgres.superuser.passwordKey }}: {{ include "encabulator.preserved" (dict "root" $ "secret" $pg "key" .Values.postgres.superuser.passwordKey "value" (randAlphaNum 24)) }}
  {{- range $db, $cfg := .Values.postgres.databases }}
  # database {{ $db }}, role {{ $cfg.user }}
  {{ $cfg.passwordKey }}: {{ include "encabulator.preserved" (dict "root" $ "secret" $pg "key" $cfg.passwordKey "value" (randAlphaNum 24)) }}
  {{- end }}
{{- end }}

{{- /* ------------------------------------------------------------------ valkey */}}
{{- if not (and .Values.valkey.external.enabled .Values.valkey.external.existingSecret) }}
{{- $vk := printf "%s-valkey" .Release.Name }}
{{- $vkpw := include "encabulator.preservedPlain" (dict "root" $ "secret" $vk "key" .Values.valkey.passwordKey "value" (randAlphaNum 32)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $vk }}
  namespace: {{ $ns }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" "valkey" "plane" "data" "component" "secret") | nindent 4 }}
type: Opaque
data:
  {{ .Values.valkey.passwordKey }}: {{ $vkpw | b64enc }}
  # Included by valkey.conf so the password never reaches the process list or a ConfigMap.
  requirepass.conf: {{ printf "requirepass %s\n" $vkpw | b64enc }}
{{- end }}

{{- /* ---------------------------------------------------------------- influxdb */}}
{{- if and .Values.influxdb.auth.enabled (not .Values.influxdb.external.enabled) }}
{{- $ix := printf "%s-influxdb" .Release.Name }}
{{- /*
  InfluxDB 3 Core has no INFLUXDB_ADMIN_TOKEN env var. It bootstraps from an *offline admin
  token file* (--admin-token-file / INFLUXDB3_ADMIN_TOKEN_FILE): JSON holding a token that
  must start with "apiv3_", which the server SHA-512-hashes into its catalog on startup and
  skips if a token of that name already exists. So one generated value lands in two keys:
  the raw string for the recorder's INFLUXDB_TOKEN, and the JSON file for the server.
*/}}
{{- $token := include "encabulator.preservedPlain" (dict "root" $ "secret" $ix "key" .Values.influxdb.auth.tokenKey "value" (printf "apiv3_%s" (randAlphaNum 48))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ix }}
  namespace: {{ $ns }}
  labels:
    {{- include "encabulator.labels" (dict "root" $ "name" "influxdb" "plane" "data" "component" "secret") | nindent 4 }}
type: Opaque
data:
  {{ .Values.influxdb.auth.tokenKey }}: {{ $token | b64enc }}
  {{ .Values.influxdb.auth.tokenFileKey }}: {{ dict "token" $token "name" .Values.influxdb.auth.tokenName | toJson | b64enc }}
{{- end }}
{{- end }}
