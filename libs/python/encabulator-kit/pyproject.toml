[project]
name = "encabulator-kit"
version = "1.0.0"
description = "Shared service kit for the Cloud Native Encabulator's Python services."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.142.0",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "nats-py>=2.16.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-asyncpg>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "testcontainers>=4.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/encabulator_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:encabulator_kit.*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "B008",      # FastAPI Depends() in defaults is the documented idiom
    "ASYNC109",  # timeout parameters are deliberate pass-throughs to httpx / nats
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]
