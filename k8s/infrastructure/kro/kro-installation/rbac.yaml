# RBAC for KRO Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kro-controller
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-controller
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
rules:
# Core Kubernetes resources
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["extensions"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["policy"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["autoscaling"]
  resources: ["*"]
  verbs: ["*"]

# Custom Resource Definitions
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["*"]

# KRO specific resources
- apiGroups: ["kro.run"]
  resources: ["*"]
  verbs: ["*"]

# ACK resources that KRO will manage
- apiGroups: ["rds.services.k8s.aws"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["elasticache.services.k8s.aws"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["iam.services.k8s.aws"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["ec2.services.k8s.aws"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["services.k8s.aws"]
  resources: ["*"]
  verbs: ["*"]

# Monitoring resources
- apiGroups: ["monitoring.coreos.com"]
  resources: ["*"]
  verbs: ["*"]

# Events for debugging
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kro-controller
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kro-controller
subjects:
- kind: ServiceAccount
  name: kro-controller
  namespace: kro-system

---
# Leader election role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kro-controller-leader-election
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kro-controller-leader-election
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kro-controller-leader-election
subjects:
- kind: ServiceAccount
  name: kro-controller
  namespace: kro-system