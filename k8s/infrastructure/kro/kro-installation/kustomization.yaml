apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kro-installation
  annotations:
    description: "Kube Resource Orchestrator (KRO) installation"

resources:
  - namespace.yaml
  - kro-controller.yaml
  - rbac.yaml

commonLabels:
  app.kubernetes.io/name: kube-resource-orchestrator
  app.kubernetes.io/component: infrastructure
  app.kubernetes.io/managed-by: kustomize