# Kube Resource Orchestrator (KRO) Controller Installation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kro-controller
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kro-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kro-controller
    spec:
      serviceAccountName: kro-controller
      containers:
      - name: controller
        image: public.ecr.aws/kro/kro:v0.1.0
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
      terminationGracePeriodSeconds: 10

---
# Service for metrics
apiVersion: v1
kind: Service
metadata:
  name: kro-controller-metrics
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
spec:
  selector:
    app.kubernetes.io/name: kro-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP

---
# ServiceMonitor for Prometheus (if monitoring is enabled)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kro-controller
  namespace: kro-system
  labels:
    app.kubernetes.io/name: kro-controller
    app.kubernetes.io/component: infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kro-controller
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s