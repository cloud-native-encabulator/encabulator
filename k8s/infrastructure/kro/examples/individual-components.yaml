# Individual Component Examples
# Using EncabulatorDatabase and EncabulatorCache separately

# Standalone database for analytics
apiVersion: encabulator.io/v1alpha1
kind: EncabulatorDatabase
metadata:
  name: analytics-db
  namespace: encabulator-data
  labels:
    app.kubernetes.io/name: analytics-db
    app.kubernetes.io/component: database
    encabulator.io/purpose: analytics
spec:
  environment: staging
  instanceClass: db.t3.medium
  storage: 50
  multiAZ: false
  backupRetention: 14
  encryption: true
  monitoring: true

---
# Standalone cache for sessions
apiVersion: encabulator.io/v1alpha1
kind: EncabulatorCache
metadata:
  name: session-cache
  namespace: encabulator-data
  labels:
    app.kubernetes.io/name: session-cache
    app.kubernetes.io/component: cache
    encabulator.io/purpose: sessions
spec:
  environment: staging
  nodeType: cache.t3.small
  replicas: 2
  engineVersion: "7.0"
  encryption: true
  multiAZ: false
  snapshotRetention: 3
  monitoring: true