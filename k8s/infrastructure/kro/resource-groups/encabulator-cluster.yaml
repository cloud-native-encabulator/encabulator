# EncabulatorCluster ResourceGroup
# Creates a custom API for managing complete environment stacks
apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: encabulator-cluster
  namespace: kro-system
  labels:
    app.kubernetes.io/name: encabulator-cluster
    app.kubernetes.io/component: infrastructure
spec:
  # Define the custom API schema
  schema:
    apiVersion: encabulator.io/v1alpha1
    kind: EncabulatorCluster
    spec:
      type: object
      properties:
        environment:
          type: string
          enum: ["development", "staging", "production"]
          default: "development"
        database:
          type: object
          properties:
            instanceClass:
              type: string
              default: "db.t3.micro"
            storage:
              type: integer
              minimum: 20
              maximum: 1000
              default: 20
            multiAZ:
              type: boolean
              default: false
            backupRetention:
              type: integer
              minimum: 0
              maximum: 35
              default: 7
          required: []
        cache:
          type: object
          properties:
            nodeType:
              type: string
              default: "cache.t3.micro"
            replicas:
              type: integer
              minimum: 1
              maximum: 6
              default: 1
            multiAZ:
              type: boolean
              default: false
          required: []
        monitoring:
          type: boolean
          default: true
        networking:
          type: object
          properties:
            ingressEnabled:
              type: boolean
              default: false
            tlsEnabled:
              type: boolean
              default: false
          required: []
      required:
        - environment

  # Define the resources that will be created
  resources:
  - id: cluster-database
    template: |
      apiVersion: encabulator.io/v1alpha1
      kind: EncabulatorDatabase
      metadata:
        name: "{{ .metadata.name }}-database"
        namespace: "{{ .metadata.namespace | default "encabulator-data" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cluster
          encabulator.io/cluster: "{{ .metadata.name }}"
      spec:
        environment: "{{ .spec.environment }}"
        instanceClass: "{{ .spec.database.instanceClass | default "db.t3.micro" }}"
        storage: {{ .spec.database.storage | default 20 }}
        multiAZ: {{ .spec.database.multiAZ | default false }}
        backupRetention: {{ .spec.database.backupRetention | default 7 }}
        encryption: true
        monitoring: {{ .spec.monitoring }}

  - id: cluster-cache
    template: |
      apiVersion: encabulator.io/v1alpha1
      kind: EncabulatorCache
      metadata:
        name: "{{ .metadata.name }}-cache"
        namespace: "{{ .metadata.namespace | default "encabulator-data" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cluster
          encabulator.io/cluster: "{{ .metadata.name }}"
      spec:
        environment: "{{ .spec.environment }}"
        nodeType: "{{ .spec.cache.nodeType | default "cache.t3.micro" }}"
        replicas: {{ .spec.cache.replicas | default 1 }}
        multiAZ: {{ .spec.cache.multiAZ | default false }}
        encryption: true
        monitoring: {{ .spec.monitoring }}

  - id: cluster-namespace
    template: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ .metadata.name }}-apps"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cluster
          encabulator.io/cluster: "{{ .metadata.name }}"
          encabulator.io/environment: "{{ .spec.environment }}"

  - id: cluster-configmap
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-config"
        namespace: "{{ .metadata.name }}-apps"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cluster
          encabulator.io/cluster: "{{ .metadata.name }}"
      data:
        environment: "{{ .spec.environment }}"
        cluster-name: "{{ .metadata.name }}"
        database-endpoint: "{{ .metadata.name }}-database-postgres.{{ .metadata.namespace | default "encabulator-data" }}.svc.cluster.local"
        cache-endpoint: "{{ .metadata.name }}-cache-redis.{{ .metadata.namespace | default "encabulator-data" }}.svc.cluster.local"
        monitoring-enabled: "{{ .spec.monitoring }}"

  - id: cluster-ingress
    template: |
      {{ if .spec.networking.ingressEnabled }}
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: "{{ .metadata.name }}-ingress"
        namespace: "{{ .metadata.name }}-apps"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cluster
          encabulator.io/cluster: "{{ .metadata.name }}"
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /
          {{ if .spec.networking.tlsEnabled }}
          cert-manager.io/cluster-issuer: letsencrypt-prod
          {{ end }}
      spec:
        {{ if .spec.networking.tlsEnabled }}
        tls:
        - hosts:
          - "{{ .metadata.name }}.encabulator.local"
          secretName: "{{ .metadata.name }}-tls"
        {{ end }}
        rules:
        - host: "{{ .metadata.name }}.encabulator.local"
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: encabulation-control-console
                  port:
                    number: 80
      {{ end }}

  # Define the status that will be reported back
  status:
    type: object
    properties:
      phase:
        type: string
        enum: ["Pending", "Creating", "Available", "Failed"]
      databaseEndpoint:
        type: string
      cacheEndpoint:
        type: string
      ingressURL:
        type: string
      conditions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            reason:
              type: string
            message:
              type: string