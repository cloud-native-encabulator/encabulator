# EncabulatorCache ResourceGroup
# Creates a custom API for managing complete cache stacks
apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: encabulator-cache
  namespace: kro-system
  labels:
    app.kubernetes.io/name: encabulator-cache
    app.kubernetes.io/component: infrastructure
spec:
  # Define the custom API schema
  schema:
    apiVersion: encabulator.io/v1alpha1
    kind: EncabulatorCache
    spec:
      type: object
      properties:
        environment:
          type: string
          enum: ["development", "staging", "production"]
          default: "development"
        nodeType:
          type: string
          default: "cache.t3.micro"
        replicas:
          type: integer
          minimum: 1
          maximum: 6
          default: 1
        engineVersion:
          type: string
          default: "7.0"
        encryption:
          type: boolean
          default: true
        multiAZ:
          type: boolean
          default: false
        snapshotRetention:
          type: integer
          minimum: 0
          maximum: 35
          default: 5
        monitoring:
          type: boolean
          default: true
      required:
        - environment

  # Define the resources that will be created
  resources:
  - id: cache-secret
    template: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ .metadata.name }}-credentials"
        namespace: "{{ .metadata.namespace | default "encabulator-data" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cache
          encabulator.io/service: prefabulated-cache
      type: Opaque
      data:
        # Base64 encoded auth token
        auth-token: ZW5jYWJ1bGF0b3JfcmVkaXNfdG9rZW5fNDU2

  - id: cache-replication-group
    template: |
      apiVersion: elasticache.services.k8s.aws/v1alpha1
      kind: ReplicationGroup
      metadata:
        name: "{{ .metadata.name }}"
        namespace: "{{ .metadata.namespace | default "encabulator-data" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cache
          encabulator.io/service: prefabulated-cache
      spec:
        replicationGroupID: "{{ .metadata.name }}-redis"
        description: "{{ .metadata.name }} Prefabulated Cache for Cloud Native Encabulator"
        cacheNodeType: "{{ .spec.nodeType }}"
        engine: redis
        engineVersion: "{{ .spec.engineVersion }}"
        replicasPerNodeGroup: {{ sub .spec.replicas 1 }}
        port: 6379
        cacheParameterGroupName: "default.redis{{ .spec.engineVersion }}"
        cacheSubnetGroupName: encabulator-cache-subnet-group
        securityGroupIDs:
          - sg-placeholder
        atRestEncryptionEnabled: {{ .spec.encryption }}
        transitEncryptionEnabled: {{ .spec.encryption }}
        authToken:
          name: "{{ .metadata.name }}-credentials"
          key: auth-token
        automaticFailoverEnabled: {{ if gt .spec.replicas 1 }}true{{ else }}false{{ end }}
        multiAZEnabled: {{ .spec.multiAZ }}
        snapshotRetentionLimit: {{ .spec.snapshotRetention }}
        snapshotWindow: "03:00-05:00"
        preferredMaintenanceWindow: "sun:05:00-sun:07:00"
        tags:
          - key: Environment
            value: "{{ .spec.environment }}"
          - key: Project
            value: cloud-native-encabulator
          - key: Component
            value: data-plane
          - key: Service
            value: prefabulated-cache
          - key: ManagedBy
            value: kro

  - id: cache-service-monitor
    template: |
      {{ if .spec.monitoring }}
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: "{{ .metadata.name }}-monitor"
        namespace: "{{ .metadata.namespace | default "encabulator-data" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: cache
          encabulator.io/service: prefabulated-cache
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}"
        endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
      {{ end }}

  # Define the status that will be reported back
  status:
    type: object
    properties:
      phase:
        type: string
        enum: ["Pending", "Creating", "Available", "Failed"]
      endpoint:
        type: string
      port:
        type: integer
      conditions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            reason:
              type: string
            message:
              type: string