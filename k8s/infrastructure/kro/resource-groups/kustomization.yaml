apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kro-resource-groups
  annotations:
    description: "KRO ResourceGroup definitions for Cloud Native Encabulator custom APIs"

resources:
  - encabulator-database.yaml
  - encabulator-cache.yaml
  - encabulator-cluster.yaml

commonLabels:
  app.kubernetes.io/name: kro-resource-groups
  app.kubernetes.io/component: infrastructure
  app.kubernetes.io/managed-by: argocd