# Development Environment Configuration for Cloud Native Encabulator
# This file contains environment-specific values that can be customized

# AWS Configuration
aws:
  region: us-west-2
  accountId: "REPLACE_WITH_ACCOUNT_ID"
  oidcProvider: "REPLACE_WITH_OIDC_PROVIDER_URL"

# Database Configuration
database:
  instanceClass: db.t3.micro
  engineVersion: "15.4"
  allocatedStorage: 20
  multiAZ: false
  deletionProtection: false
  backupRetentionPeriod: 7

# Cache Configuration  
cache:
  nodeType: cache.t3.micro
  engineVersion: "7.0"
  numCacheClusters: 1
  automaticFailoverEnabled: false
  multiAZEnabled: false
  snapshotRetentionLimit: 5

# Security Groups (to be replaced with actual values)
securityGroups:
  database: sg-placeholder-db
  cache: sg-placeholder-cache

# Subnet Groups (to be created separately or via VPC controller)
subnetGroups:
  database: encabulator-db-subnet-group
  cache: encabulator-cache-subnet-group

# Resource Limits for ACK Controllers
ackControllers:
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 50m
      memory: 200Mi