# Prefabulated Cache - Redis Cluster via ACK
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: prefabulated-cache
  namespace: encabulator-data
  labels:
    app.kubernetes.io/name: prefabulated-cache
    app.kubernetes.io/component: data-plane
    encabulator.io/service: prefabulated-cache
spec:
  replicationGroupID: cloud-native-encabulator-redis
  description: "Prefabulated Cache for Cloud Native Encabulator"
  cacheNodeType: cache.t3.micro
  engine: redis
  engineVersion: "7.0"
  replicasPerNodeGroup: 0  # Single node for development
  port: 6379
  cacheParameterGroupName: default.redis7.0
  cacheSubnetGroupName: encabulator-cache-subnet-group
  securityGroupIDs:
    - sg-placeholder  # Will be replaced with actual security group
  atRestEncryptionEnabled: true
  transitEncryptionEnabled: true
  # Auth token will be managed via Kubernetes Secret
  authToken:
    name: prefabulated-cache-credentials
    key: auth-token
  automaticFailoverEnabled: false  # Set to true for production with multiple nodes
  multiAZEnabled: false  # Set to true for production
  snapshotRetentionLimit: 5
  snapshotWindow: "03:00-05:00"
  preferredMaintenanceWindow: "sun:05:00-sun:07:00"
  tags:
    - key: Environment
      value: development
    - key: Project
      value: cloud-native-encabulator
    - key: Component
      value: data-plane
    - key: Service
      value: prefabulated-cache
    - key: ManagedBy
      value: ack

---
# Cache credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: prefabulated-cache-credentials
  namespace: encabulator-data
type: Opaque
data:
  # Base64 encoded auth token: "encabulator_redis_token_456"
  auth-token: ZW5jYWJ1bGF0b3JfcmVkaXNfdG9rZW5fNDU2