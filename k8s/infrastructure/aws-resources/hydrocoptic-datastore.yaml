# Hydrocoptic Data Store - PostgreSQL Database via ACK
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBInstance
metadata:
  name: hydrocoptic-datastore
  namespace: encabulator-data
  labels:
    app.kubernetes.io/name: hydrocoptic-datastore
    app.kubernetes.io/component: data-plane
    encabulator.io/service: hydrocoptic-datastore
spec:
  dbInstanceIdentifier: cloud-native-encabulator-postgres
  dbInstanceClass: db.t3.micro
  engine: postgres
  engineVersion: "15.4"
  masterUsername: encabulator_admin
  # Password will be managed via Kubernetes Secret
  masterUserPassword:
    name: hydrocoptic-datastore-credentials
    key: password
  allocatedStorage: 20
  storageType: gp2
  storageEncrypted: true
  backupRetentionPeriod: 7
  deletionProtection: false  # Set to true for production
  multiAZ: false  # Set to true for production
  publiclyAccessible: false
  vpcSecurityGroupIDs:
    - sg-placeholder  # Will be replaced with actual security group
  dbSubnetGroupName: encabulator-db-subnet-group
  tags:
    - key: Environment
      value: development
    - key: Project
      value: cloud-native-encabulator
    - key: Component
      value: data-plane
    - key: Service
      value: hydrocoptic-datastore
    - key: ManagedBy
      value: ack

---
# Database credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: hydrocoptic-datastore-credentials
  namespace: encabulator-data
type: Opaque
data:
  # Base64 encoded password: "encabulator_dev_password_123"
  password: ZW5jYWJ1bGF0b3JfZGV2X3Bhc3N3b3JkXzEyMw==
