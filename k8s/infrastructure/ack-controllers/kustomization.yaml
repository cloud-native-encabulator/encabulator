apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ack-controllers
  annotations:
    description: "AWS Controllers for Kubernetes (ACK) installation - Direct Kubernetes manifests"

resources:
  - namespace.yaml
  - rds-controller.yaml
  - elasticache-controller.yaml
  - iam-controller.yaml

commonLabels:
  app.kubernetes.io/name: ack-controllers
  app.kubernetes.io/component: infrastructure
  app.kubernetes.io/managed-by: kustomize

# Note: For ArgoCD deployment using OCI Helm charts, 
# see argocd/infrastructure/ack-controllers-apps/ instead