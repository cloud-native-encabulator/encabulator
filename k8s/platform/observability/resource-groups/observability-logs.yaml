# ObservabilityLogs ResourceGroup
# Creates a custom API for managing Loki log aggregation stack
apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: observability-logs
  namespace: kro-system
  labels:
    app.kubernetes.io/name: observability-logs
    app.kubernetes.io/component: observability
spec:
  # Define the custom API schema
  schema:
    apiVersion: observability.encabulator.io/v1alpha1
    kind: ObservabilityLogs
    spec:
      type: object
      properties:
        environment:
          type: string
          enum: ["development", "staging", "production"]
          default: "development"
        retention:
          type: string
          default: "7d"
        storage:
          type: string
          default: "10Gi"
        logLevel:
          type: string
          enum: ["debug", "info", "warn", "error"]
          default: "info"
        compaction:
          type: boolean
          default: true
        resources:
          type: object
          properties:
            loki:
              type: object
              properties:
                requests:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "200m"
                    memory:
                      type: string
                      default: "512Mi"
                limits:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "500m"
                    memory:
                      type: string
                      default: "1Gi"
            promtail:
              type: object
              properties:
                requests:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "100m"
                    memory:
                      type: string
                      default: "128Mi"
                limits:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "200m"
                    memory:
                      type: string
                      default: "256Mi"
      required:
        - environment

  # Define the resources that will be created
  resources:
  - id: logs-namespace
    template: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: observability
          encabulator.io/observability: logs

  - id: loki-config
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-loki-config"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: loki
      data:
        loki.yaml: |
          auth_enabled: false
          
          server:
            http_listen_port: 3100
            grpc_listen_port: 9096
            log_level: {{ .spec.logLevel | default "info" }}
          
          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              instance_addr: 127.0.0.1
              kvstore:
                store: inmemory
          
          query_range:
            results_cache:
              cache:
                embedded_cache:
                  enabled: true
                  max_size_mb: 100
          
          schema_config:
            configs:
              - from: 2020-10-24
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h
          
          ruler:
            alertmanager_url: http://encabulator-metrics-prometheus.encabulator-monitoring:9093
          
          limits_config:
            retention_period: {{ .spec.retention | default "7d" }}
            enforce_metric_name: false
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
          
          {{- if .spec.compaction }}
          compactor:
            working_directory: /loki/boltdb-shipper-compactor
            shared_store: filesystem
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            retention_delete_worker_count: 150
          {{- end }}
          
          analytics:
            reporting_enabled: false

  - id: loki-storage
    template: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .metadata.name }}-loki-storage"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: loki
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .spec.storage | default "10Gi" }}

  - id: loki-deployment
    template: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ .metadata.name }}-loki"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: loki
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}"
            app.kubernetes.io/component: loki
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ .metadata.name }}"
              app.kubernetes.io/component: loki
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "3100"
          spec:
            containers:
            - name: loki
              image: grafana/loki:2.9.0
              args:
                - -config.file=/etc/loki/loki.yaml
              ports:
              - containerPort: 3100
                name: http-metrics
                protocol: TCP
              - containerPort: 9096
                name: grpc
                protocol: TCP
              resources:
                requests:
                  cpu: {{ .spec.resources.loki.requests.cpu | default "200m" }}
                  memory: {{ .spec.resources.loki.requests.memory | default "512Mi" }}
                limits:
                  cpu: {{ .spec.resources.loki.limits.cpu | default "500m" }}
                  memory: {{ .spec.resources.loki.limits.memory | default "1Gi" }}
              volumeMounts:
              - name: loki-config
                mountPath: /etc/loki
              - name: loki-storage
                mountPath: /loki
              livenessProbe:
                httpGet:
                  path: /ready
                  port: 3100
                initialDelaySeconds: 45
                timeoutSeconds: 10
              readinessProbe:
                httpGet:
                  path: /ready
                  port: 3100
                initialDelaySeconds: 45
                timeoutSeconds: 10
            volumes:
            - name: loki-config
              configMap:
                name: "{{ .metadata.name }}-loki-config"
            - name: loki-storage
              persistentVolumeClaim:
                claimName: "{{ .metadata.name }}-loki-storage"

  - id: loki-service
    template: |
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .metadata.name }}-loki"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: loki
      spec:
        selector:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: loki
        ports:
        - name: http-metrics
          port: 3100
          targetPort: 3100
          protocol: TCP
        - name: grpc
          port: 9096
          targetPort: 9096
          protocol: TCP
        type: ClusterIP

  - id: promtail-config
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-promtail-config"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      data:
        promtail.yaml: |
          server:
            http_listen_port: 3101
            grpc_listen_port: 0
          
          positions:
            filename: /tmp/positions.yaml
          
          clients:
            - url: http://{{ .metadata.name }}-loki:3100/loki/api/v1/push
          
          scrape_configs:
          # Kubernetes pod logs
          - job_name: kubernetes-pods
            kubernetes_sd_configs:
              - role: pod
            pipeline_stages:
              - cri: {}
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_controller_name
                regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
                target_label: __tmp_controller_name
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                  - __meta_kubernetes_pod_label_app
                  - __tmp_controller_name
                  - __meta_kubernetes_pod_name
                regex: ^;*([^;]+)(;.*)?$
                target_label: app
                replacement: $1
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_component
                  - __meta_kubernetes_pod_label_component
                regex: ^;*([^;]+)(;.*)?$
                target_label: component
                replacement: $1
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_version
                  - __meta_kubernetes_pod_label_version
                regex: ^;*([^;]+)(;.*)?$
                target_label: version
                replacement: $1
              - source_labels:
                  - __meta_kubernetes_namespace
                target_label: namespace
              - source_labels:
                  - __meta_kubernetes_pod_name
                target_label: pod
              - source_labels:
                  - __meta_kubernetes_pod_container_name
                target_label: container
              - source_labels:
                  - __meta_kubernetes_pod_node_name
                target_label: node_name
              - source_labels:
                  - __meta_kubernetes_namespace
                  - __meta_kubernetes_pod_name
                target_label: job
                separator: /
                replacement: $1
              - replacement: /var/log/pods/*$1/*.log
                separator: /
                source_labels:
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                target_label: __path__
              - replacement: /var/log/pods/*$1/*.log
                regex: true/(.*)
                source_labels:
                  - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
                  - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
                  - __meta_kubernetes_pod_container_name
                target_label: __path__
          
          # Kubernetes system logs
          - job_name: kubernetes-system
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: kubernetes-system
                  __path__: /var/log/syslog
          
          # Encabulator specific logs with enhanced parsing
          - job_name: encabulator-services
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - encabulator-system
                    - encabulator-data
                    - encabulator-control
            pipeline_stages:
              - cri: {}
              - json:
                  expressions:
                    level: level
                    message: message
                    timestamp: timestamp
                    service: service
                    trace_id: trace_id
                    span_id: span_id
              - labels:
                  level:
                  service:
              - timestamp:
                  source: timestamp
                  format: RFC3339Nano
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                regex: encabulator-.*
                action: keep
              - source_labels: [__meta_kubernetes_pod_label_encabulator_io_component]
                target_label: encabulator_component
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_container_name]
                target_label: container

  - id: promtail-rbac
    template: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ .metadata.name }}-promtail"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ .metadata.name }}-promtail"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      rules:
      - apiGroups: [""]
        resources:
        - nodes
        - nodes/proxy
        - services
        - endpoints
        - pods
        verbs: ["get", "list", "watch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ .metadata.name }}-promtail"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ .metadata.name }}-promtail"
      subjects:
      - kind: ServiceAccount
        name: "{{ .metadata.name }}-promtail"
        namespace: encabulator-logging

  - id: promtail-daemonset
    template: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: "{{ .metadata.name }}-promtail"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}"
            app.kubernetes.io/component: promtail
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ .metadata.name }}"
              app.kubernetes.io/component: promtail
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "3101"
          spec:
            serviceAccountName: "{{ .metadata.name }}-promtail"
            containers:
            - name: promtail
              image: grafana/promtail:2.9.0
              args:
                - -config.file=/etc/promtail/promtail.yaml
              ports:
              - containerPort: 3101
                name: http-metrics
                protocol: TCP
              resources:
                requests:
                  cpu: {{ .spec.resources.promtail.requests.cpu | default "100m" }}
                  memory: {{ .spec.resources.promtail.requests.memory | default "128Mi" }}
                limits:
                  cpu: {{ .spec.resources.promtail.limits.cpu | default "200m" }}
                  memory: {{ .spec.resources.promtail.limits.memory | default "256Mi" }}
              env:
              - name: HOSTNAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              volumeMounts:
              - name: promtail-config
                mountPath: /etc/promtail
              - name: varlog
                mountPath: /var/log
                readOnly: true
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
                readOnly: true
              - name: etcmachineid
                mountPath: /etc/machine-id
                readOnly: true
              livenessProbe:
                httpGet:
                  path: /ready
                  port: 3101
                initialDelaySeconds: 10
                timeoutSeconds: 10
              readinessProbe:
                httpGet:
                  path: /ready
                  port: 3101
                initialDelaySeconds: 10
                timeoutSeconds: 10
            volumes:
            - name: promtail-config
              configMap:
                name: "{{ .metadata.name }}-promtail-config"
            - name: varlog
              hostPath:
                path: /var/log
            - name: varlibdockercontainers
              hostPath:
                path: /var/lib/docker/containers
            - name: etcmachineid
              hostPath:
                path: /etc/machine-id
            tolerations:
            - effect: NoSchedule
              operator: Exists
            - effect: NoExecute
              operator: Exists

  - id: promtail-service
    template: |
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .metadata.name }}-promtail"
        namespace: encabulator-logging
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
      spec:
        selector:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: promtail
        ports:
        - name: http-metrics
          port: 3101
          targetPort: 3101
          protocol: TCP
        type: ClusterIP

  # Define the status that will be reported back
  status:
    type: object
    properties:
      phase:
        type: string
        enum: ["Pending", "Deploying", "Ready", "Failed"]
      lokiEndpoint:
        type: string
      promtailNodes:
        type: integer
      conditions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            reason:
              type: string
            message:
              type: string