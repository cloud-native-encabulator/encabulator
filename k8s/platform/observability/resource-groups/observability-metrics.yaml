# ObservabilityMetrics ResourceGroup
# Creates a custom API for managing Prometheus monitoring stack
apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: observability-metrics
  namespace: kro-system
  labels:
    app.kubernetes.io/name: observability-metrics
    app.kubernetes.io/component: platform
spec:
  # Define the custom API schema
  schema:
    apiVersion: observability.encabulator.io/v1alpha1
    kind: ObservabilityMetrics
    spec:
      type: object
      properties:
        environment:
          type: string
          enum: ["development", "staging", "production"]
          default: "development"
        retention:
          type: string
          default: "15d"
        storage:
          type: string
          default: "10Gi"
        alerting:
          type: boolean
          default: true
        scrapeInterval:
          type: string
          default: "30s"
        resources:
          type: object
          properties:
            prometheus:
              type: object
              properties:
                cpu:
                  type: string
                  default: "200m"
                memory:
                  type: string
                  default: "512Mi"
            grafana:
              type: object
              properties:
                cpu:
                  type: string
                  default: "100m"
                memory:
                  type: string
                  default: "256Mi"
      required:
        - environment

  # Define the resources that will be created
  resources:
  - id: prometheus-deployment
    template: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ .metadata.name }}-prometheus"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
          encabulator.io/observability: metrics
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          spec:
            serviceAccountName: "{{ .metadata.name }}-prometheus"
            containers:
            - name: prometheus
              image: prom/prometheus:v2.45.0
              args:
              - --config.file=/etc/prometheus/prometheus.yml
              - --storage.tsdb.path=/prometheus/
              - --web.console.libraries=/etc/prometheus/console_libraries
              - --web.console.templates=/etc/prometheus/consoles
              - --storage.tsdb.retention.time={{ .spec.retention }}
              - --web.enable-lifecycle
              ports:
              - containerPort: 9090
                name: web
              resources:
                limits:
                  cpu: "{{ .spec.resources.prometheus.cpu | default "200m" }}"
                  memory: "{{ .spec.resources.prometheus.memory | default "512Mi" }}"
                requests:
                  cpu: "{{ .spec.resources.prometheus.cpu | default "200m" }}"
                  memory: "{{ .spec.resources.prometheus.memory | default "512Mi" }}"
              volumeMounts:
              - name: prometheus-config
                mountPath: /etc/prometheus
              - name: prometheus-storage
                mountPath: /prometheus
            volumes:
            - name: prometheus-config
              configMap:
                name: "{{ .metadata.name }}-prometheus-config"
            - name: prometheus-storage
              persistentVolumeClaim:
                claimName: "{{ .metadata.name }}-prometheus-storage"

  - id: prometheus-config
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-prometheus-config"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
      data:
        prometheus.yml: |
          global:
            scrape_interval: {{ .spec.scrapeInterval }}
            evaluation_interval: {{ .spec.scrapeInterval }}
          
          rule_files:
            - "/etc/prometheus/rules/*.yml"
          
          {{ if .spec.alerting }}
          alerting:
            alertmanagers:
            - static_configs:
              - targets:
                - "{{ .metadata.name }}-alertmanager:9093"
          {{ end }}
          
          scrape_configs:
          # Kubernetes API server
          - job_name: 'kubernetes-apiservers'
            kubernetes_sd_configs:
            - role: endpoints
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            relabel_configs:
            - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: default;kubernetes;https
          
          # Kubernetes nodes
          - job_name: 'kubernetes-nodes'
            kubernetes_sd_configs:
            - role: node
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
          
          # ACK Controllers
          - job_name: 'ack-controllers'
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                - ack-system
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: ack-.*-metrics
          
          # KRO Controller
          - job_name: 'kro-controller'
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                - kro-system
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: kro-controller-metrics
          
          # ArgoCD
          - job_name: 'argocd'
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                - argocd
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: argocd-.*-metrics

  - id: prometheus-pvc
    template: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .metadata.name }}-prometheus-storage"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: "{{ .spec.storage }}"

  - id: prometheus-service
    template: |
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .metadata.name }}-prometheus"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
      spec:
        selector:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
        ports:
        - name: web
          port: 9090
          targetPort: web

  - id: prometheus-serviceaccount
    template: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ .metadata.name }}-prometheus"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics

  - id: prometheus-clusterrole
    template: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ .metadata.name }}-prometheus"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
      rules:
      - apiGroups: [""]
        resources:
        - nodes
        - nodes/proxy
        - services
        - endpoints
        - pods
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions"]
        resources:
        - ingresses
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

  - id: prometheus-clusterrolebinding
    template: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ .metadata.name }}-prometheus"
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}-prometheus"
          app.kubernetes.io/component: metrics
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ .metadata.name }}-prometheus"
      subjects:
      - kind: ServiceAccount
        name: "{{ .metadata.name }}-prometheus"
        namespace: "{{ .metadata.namespace | default "encabulator-monitoring" }}"

  # Define the status that will be reported back
  status:
    type: object
    properties:
      phase:
        type: string
        enum: ["Pending", "Creating", "Available", "Failed"]
      prometheusEndpoint:
        type: string
      grafanaEndpoint:
        type: string
      conditions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            reason:
              type: string
            message:
              type: string