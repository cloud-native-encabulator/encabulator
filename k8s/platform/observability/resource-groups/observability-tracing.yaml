# ObservabilityTracing ResourceGroup
# Creates a custom API for managing Jaeger distributed tracing stack
apiVersion: kro.run/v1alpha1
kind: ResourceGroup
metadata:
  name: observability-tracing
  namespace: kro-system
  labels:
    app.kubernetes.io/name: observability-tracing
    app.kubernetes.io/component: observability
spec:
  # Define the custom API schema
  schema:
    apiVersion: observability.encabulator.io/v1alpha1
    kind: ObservabilityTracing
    spec:
      type: object
      properties:
        environment:
          type: string
          enum: ["development", "staging", "production"]
          default: "development"
        storage:
          type: object
          properties:
            type:
              type: string
              enum: ["memory", "elasticsearch", "cassandra"]
              default: "memory"
            retention:
              type: string
              default: "24h"
            size:
              type: string
              default: "5Gi"
        sampling:
          type: object
          properties:
            strategy:
              type: string
              enum: ["const", "probabilistic", "rateLimiting", "adaptive"]
              default: "probabilistic"
            param:
              type: number
              default: 0.1
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu:
                  type: string
                  default: "100m"
                memory:
                  type: string
                  default: "256Mi"
            limits:
              type: object
              properties:
                cpu:
                  type: string
                  default: "300m"
                memory:
                  type: string
                  default: "512Mi"
      required:
        - environment

  # Define the resources that will be created
  resources:
  - id: tracing-namespace
    template: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: observability
          encabulator.io/observability: tracing

  - id: jaeger-config
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-jaeger-config"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: jaeger
      data:
        sampling_strategies.json: |
          {
            "service_strategies": [
              {
                "service": "encabulator-*",
                "type": "{{ .spec.sampling.strategy | default "probabilistic" }}",
                "param": {{ .spec.sampling.param | default 0.1 }}
              }
            ],
            "default_strategy": {
              "type": "{{ .spec.sampling.strategy | default "probabilistic" }}",
              "param": {{ .spec.sampling.param | default 0.1 }}
            }
          }

  - id: jaeger-storage
    template: |
      {{- if eq (.spec.storage.type | default "memory") "memory" }}
      # Memory storage - no PVC needed
      {{- else }}
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ .metadata.name }}-jaeger-storage"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: jaeger
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .spec.storage.size | default "5Gi" }}
      {{- end }}

  - id: jaeger-deployment
    template: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ .metadata.name }}-jaeger"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: jaeger
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}"
            app.kubernetes.io/component: jaeger
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ .metadata.name }}"
              app.kubernetes.io/component: jaeger
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "14269"
          spec:
            containers:
            - name: jaeger
              image: jaegertracing/all-in-one:1.50
              args:
                - --memory.max-traces=50000
                - --query.base-path=/jaeger
                - --prometheus.server-url=http://encabulator-metrics-prometheus.encabulator-monitoring:9090
                - --prometheus.query.support-spanmetrics-connector=true
                {{- if eq (.spec.storage.type | default "memory") "memory" }}
                - --span-storage.type=memory
                {{- end }}
              ports:
              - containerPort: 16686
                name: query
                protocol: TCP
              - containerPort: 14268
                name: http-thrift
                protocol: TCP
              - containerPort: 14250
                name: grpc
                protocol: TCP
              - containerPort: 14269
                name: admin
                protocol: TCP
              - containerPort: 6831
                name: jaeger-thrift
                protocol: UDP
              - containerPort: 6832
                name: jaeger-binary
                protocol: UDP
              - containerPort: 5778
                name: config-rest
                protocol: TCP
              resources:
                requests:
                  cpu: {{ .spec.resources.requests.cpu | default "100m" }}
                  memory: {{ .spec.resources.requests.memory | default "256Mi" }}
                limits:
                  cpu: {{ .spec.resources.limits.cpu | default "300m" }}
                  memory: {{ .spec.resources.limits.memory | default "512Mi" }}
              env:
              - name: COLLECTOR_OTLP_ENABLED
                value: "true"
              - name: METRICS_STORAGE_TYPE
                value: prometheus
              - name: PROMETHEUS_SERVER_URL
                value: http://encabulator-metrics-prometheus.encabulator-monitoring:9090
              volumeMounts:
              - name: jaeger-config
                mountPath: /etc/jaeger/
              {{- if ne (.spec.storage.type | default "memory") "memory" }}
              - name: jaeger-storage
                mountPath: /badger
              {{- end }}
              livenessProbe:
                httpGet:
                  path: /
                  port: 14269
                initialDelaySeconds: 30
                timeoutSeconds: 10
              readinessProbe:
                httpGet:
                  path: /
                  port: 14269
                initialDelaySeconds: 10
                timeoutSeconds: 10
            volumes:
            - name: jaeger-config
              configMap:
                name: "{{ .metadata.name }}-jaeger-config"
            {{- if ne (.spec.storage.type | default "memory") "memory" }}
            - name: jaeger-storage
              persistentVolumeClaim:
                claimName: "{{ .metadata.name }}-jaeger-storage"
            {{- end }}

  - id: jaeger-service
    template: |
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .metadata.name }}-jaeger"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: jaeger
      spec:
        selector:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: jaeger
        ports:
        - name: query
          port: 16686
          targetPort: 16686
          protocol: TCP
        - name: http-thrift
          port: 14268
          targetPort: 14268
          protocol: TCP
        - name: grpc
          port: 14250
          targetPort: 14250
          protocol: TCP
        - name: admin
          port: 14269
          targetPort: 14269
          protocol: TCP
        - name: jaeger-thrift
          port: 6831
          targetPort: 6831
          protocol: UDP
        - name: jaeger-binary
          port: 6832
          targetPort: 6832
          protocol: UDP
        - name: config-rest
          port: 5778
          targetPort: 5778
          protocol: TCP
        type: ClusterIP

  - id: otel-collector-config
    template: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ .metadata.name }}-otel-collector-config"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: otel-collector
      data:
        otel-collector-config.yaml: |
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            jaeger:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:14250
                thrift_http:
                  endpoint: 0.0.0.0:14268
                thrift_compact:
                  endpoint: 0.0.0.0:6831
                thrift_binary:
                  endpoint: 0.0.0.0:6832
            zipkin:
              endpoint: 0.0.0.0:9411

          processors:
            batch:
              timeout: 1s
              send_batch_size: 1024
            resource:
              attributes:
              - key: service.name
                from_attribute: service_name
                action: insert
              - key: service.version
                from_attribute: service_version
                action: insert
              - key: deployment.environment
                value: {{ .spec.environment }}
                action: insert

          exporters:
            jaeger:
              endpoint: "{{ .metadata.name }}-jaeger:14250"
              tls:
                insecure: true
            prometheus:
              endpoint: "0.0.0.0:8889"
              const_labels:
                environment: {{ .spec.environment }}

          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
            pprof:
              endpoint: 0.0.0.0:1777
            zpages:
              endpoint: 0.0.0.0:55679

          service:
            extensions: [health_check, pprof, zpages]
            pipelines:
              traces:
                receivers: [otlp, jaeger, zipkin]
                processors: [resource, batch]
                exporters: [jaeger]
              metrics:
                receivers: [otlp]
                processors: [resource, batch]
                exporters: [prometheus]

  - id: otel-collector-deployment
    template: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ .metadata.name }}-otel-collector"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: otel-collector
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ .metadata.name }}"
            app.kubernetes.io/component: otel-collector
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ .metadata.name }}"
              app.kubernetes.io/component: otel-collector
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8889"
          spec:
            containers:
            - name: otel-collector
              image: otel/opentelemetry-collector-contrib:0.88.0
              args:
                - --config=/etc/otel-collector-config.yaml
              ports:
              - containerPort: 4317
                name: otlp-grpc
                protocol: TCP
              - containerPort: 4318
                name: otlp-http
                protocol: TCP
              - containerPort: 14250
                name: jaeger-grpc
                protocol: TCP
              - containerPort: 14268
                name: jaeger-http
                protocol: TCP
              - containerPort: 6831
                name: jaeger-thrift
                protocol: UDP
              - containerPort: 6832
                name: jaeger-binary
                protocol: UDP
              - containerPort: 9411
                name: zipkin
                protocol: TCP
              - containerPort: 8889
                name: prometheus
                protocol: TCP
              - containerPort: 13133
                name: health
                protocol: TCP
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
              - name: otel-collector-config
                mountPath: /etc/otel-collector-config.yaml
                subPath: otel-collector-config.yaml
              livenessProbe:
                httpGet:
                  path: /
                  port: 13133
                initialDelaySeconds: 30
                timeoutSeconds: 10
              readinessProbe:
                httpGet:
                  path: /
                  port: 13133
                initialDelaySeconds: 10
                timeoutSeconds: 10
            volumes:
            - name: otel-collector-config
              configMap:
                name: "{{ .metadata.name }}-otel-collector-config"

  - id: otel-collector-service
    template: |
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ .metadata.name }}-otel-collector"
        namespace: encabulator-tracing
        labels:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: otel-collector
      spec:
        selector:
          app.kubernetes.io/name: "{{ .metadata.name }}"
          app.kubernetes.io/component: otel-collector
        ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        - name: jaeger-grpc
          port: 14250
          targetPort: 14250
          protocol: TCP
        - name: jaeger-http
          port: 14268
          targetPort: 14268
          protocol: TCP
        - name: jaeger-thrift
          port: 6831
          targetPort: 6831
          protocol: UDP
        - name: jaeger-binary
          port: 6832
          targetPort: 6832
          protocol: UDP
        - name: zipkin
          port: 9411
          targetPort: 9411
          protocol: TCP
        - name: prometheus
          port: 8889
          targetPort: 8889
          protocol: TCP
        type: ClusterIP

  # Define the status that will be reported back
  status:
    type: object
    properties:
      phase:
        type: string
        enum: ["Pending", "Deploying", "Ready", "Failed"]
      jaegerEndpoint:
        type: string
      collectorEndpoint:
        type: string
      conditions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            status:
              type: string
            reason:
              type: string
            message:
              type: string