apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: observability-resource-groups
  annotations:
    description: "KRO ResourceGroup definitions for Cloud Native Encabulator observability stack"

resources:
  - observability-metrics.yaml
  - observability-tracing.yaml
  - observability-logs.yaml
  - observability-stack.yaml

commonLabels:
  app.kubernetes.io/name: observability-resource-groups
  app.kubernetes.io/component: platform
  app.kubernetes.io/managed-by: argocd