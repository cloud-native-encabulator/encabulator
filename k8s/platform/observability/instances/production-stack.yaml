# Production ObservabilityStack Instance
# This creates a production-grade observability stack with enhanced resources and persistence
apiVersion: observability.encabulator.io/v1alpha1
kind: ObservabilityStack
metadata:
  name: encabulator-observability-prod
  namespace: encabulator-monitoring
  labels:
    app.kubernetes.io/name: encabulator-observability-prod
    app.kubernetes.io/component: observability
    encabulator.io/environment: production
spec:
  environment: production
  
  # Prometheus metrics configuration - production settings
  metrics:
    enabled: true
    retention: 30d
    storage: 50Gi
    alerting: true
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  
  # Jaeger tracing configuration - with persistent storage
  tracing:
    enabled: true
    storage:
      type: elasticsearch  # Would need ES setup in real deployment
      retention: 7d
      size: 20Gi
    sampling:
      strategy: adaptive
      param: 0.01  # Lower sampling rate for production
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  
  # Loki logging configuration - production settings
  logging:
    enabled: true
    retention: 14d
    storage: 100Gi
    logLevel: warn
    compaction: true
    resources:
      loki:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
      promtail:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  
  # Grafana dashboard configuration - production settings
  grafana:
    enabled: true
    adminPassword: CHANGE_ME_IN_PRODUCTION
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi