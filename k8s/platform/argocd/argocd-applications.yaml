---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: applications-root
    app.kubernetes.io/component: platform
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: cloud-native-encabulator
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
