# Root ArgoCD Applications for Cloud Native Encabulator
# These are the top-level applications that manage the entire system

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: infrastructure-root
    app.kubernetes.io/component: platform
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: argocd/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
  - name: Description
    value: "Root application managing all infrastructure components"
  - name: Components
    value: "ACK Controllers, AWS Resources, KRO, Monitoring"

---
apiVersion: argoproj.io/v1alpha1
kind: Application
