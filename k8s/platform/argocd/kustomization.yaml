apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: argocd-platform
  annotations:
    description: "ArgoCD GitOps platform installation for Cloud Native Encabulator"

resources:
  - namespace.yaml
  - argocd-install.yaml
  - argocd-config.yaml
  - argocd-projects.yaml
  - argocd-applications.yaml

commonLabels:
  app.kubernetes.io/name: argocd
  app.kubernetes.io/component: platform
  app.kubernetes.io/managed-by: kustomize
  encabulator.io/platform: gitops