apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: ack-elasticache-controller-role
  namespace: ack-system
spec:
  name: ack-elasticache-controller-role
  description: IAM role for ACK ElastiCache controller to manage ElastiCache resources
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::510431938379:oidc-provider/oidc.eks.us-east-2.amazonaws.com/id/63F3220620BF411D64B991CE6B661B38"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "oidc.eks.us-east-2.amazonaws.com/id/63F3220620BF411D64B991CE6B661B38:sub": "system:serviceaccount:ack-system:ack-elasticache-controller",
              "oidc.eks.us-east-2.amazonaws.com/id/63F3220620BF411D64B991CE6B661B38:aud": "sts.amazonaws.com"
            }
          }
        }
      ]
    }
  policies:
    - policyName: ACKElastiCacheControllerPolicy
      policyDocument: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "elasticache:CreateCacheCluster",
                "elasticache:DeleteCacheCluster",
                "elasticache:DescribeCacheClusters",
                "elasticache:ModifyCacheCluster",
                "elasticache:AddTagsToResource",
                "elasticache:RemoveTagsFromResource",
                "elasticache:ListTagsForResource",
                "elasticache:CreateCacheSubnetGroup",
                "elasticache:DeleteCacheSubnetGroup",
                "elasticache:DescribeCacheSubnetGroups",
                "elasticache:ModifyCacheSubnetGroup",
                "elasticache:CreateCacheParameterGroup",
                "elasticache:DeleteCacheParameterGroup",
                "elasticache:DescribeCacheParameterGroups",
                "elasticache:ModifyCacheParameterGroup",
                "elasticache:DescribeCacheParameters",
                "elasticache:ResetCacheParameterGroup",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeSubnets",
                "ec2:DescribeVpcs",
                "ec2:DescribeAvailabilityZones"
              ],
              "Resource": "*"
            }
          ]
        }
  tags:
    - key: ManagedBy
      value: ACK
    - key: Service
      value: elasticache-controller
