# What a cell gets from this folder besides the three charts: the Grafana dashboards and the
# ServiceMonitor for the fifteen services. Argo CD builds it with kustomize as the
# observability-config Application of every cell (gitops/hub/appset.yaml).
#
# The ConfigMaps are the ones `scripts/platform.sh dashboards` creates on the hub: same names,
# the file name as the data key, label grafana_dashboard=1 (what the Grafana sidecar watches)
# and the grafana_folder annotation. `scripts/platform.sh template-cell` checks that the two
# stay identical.
#
# The kustomization sits at platform/ because kustomize reads files only from below its own
# folder, and the dashboards are shared with the hub.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: encabulator-observability
resources:
  - cell/servicemonitor-encabulator-services.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: encabulator
  annotations:
    grafana_folder: Encabulator
configMapGenerator:
  - name: encabulator-dashboard-backing-stores
    files:
      - dashboards/backing-stores.json
  - name: encabulator-dashboard-encabulator-works
    files:
      - dashboards/encabulator-works.json
  - name: encabulator-dashboard-service-red
    files:
      - dashboards/service-red.json
