[project]
name = "logarithmic-casing-line"
version = "1.0.0"
description = "Fabrication workers: the malleable logarithmic casing surmounts everything."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "encabulator-kit",
    "numpy>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "testcontainers>=4.13.0",
]

[tool.uv.sources]
encabulator-kit = { path = "../../../libs/python/encabulator-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casing_line"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PT", "SLF", "C90"]
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "SLF001", "RUF059"]
