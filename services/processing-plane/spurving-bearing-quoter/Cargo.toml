[package]
name = "spurving-bearing-quoter"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Pricing engine for the Cloud Native Encabulator: aligns the spurving bearings with the pentametric fan, economically."
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path", "original-uri"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
fastrand = "2.5.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "server-graceful", "service"] }
opentelemetry = { version = "0.33.0", features = ["trace"] }
opentelemetry-http = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-semantic-conventions = { version = "0.33.0", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.33.0", features = ["trace", "rt-tokio"] }
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "acl", "script"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "registry", "tracing-log"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
