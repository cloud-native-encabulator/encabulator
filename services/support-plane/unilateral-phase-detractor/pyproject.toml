[project]
name = "unilateral-phase-detractor"
version = "1.0.0"
description = "Supplies inverse reactive credentials for use in unilateral phase detractors."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "encabulator-kit",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.44",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "testcontainers>=4.13.0",
]

[tool.uv.sources]
encabulator-kit = { path = "../../../libs/python/encabulator-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detractor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PT", "S", "SLF", "C90"]
ignore = ["B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PT011", "SLF001"]
