# InfluxDB configuration for Sinusoidal Database
# Cloud Native Encabulator - Data Plane

# Admin user configuration
adminUser:
  user: "sinusoidal-admin"
  password: "sinusoidal-password"
  token: "sinusoidal-admin-token"
  organization: "encabulator"
  bucket: "sinusoidal-data"

# Resource configuration
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistence configuration
persistence:
  enabled: true
  size: 8Gi
  # Use default storage class
  # storageClass: ""

# Service configuration
service:
  type: ClusterIP
  port: 8086
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8086"
    prometheus.io/path: "/metrics"

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # InfluxDB needs to write to filesystem
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 1000

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Environment variables for Encabulator context
env:
  - name: INFLUXDB_DB
    value: "sinusoidal-data"
  - name: INFLUXDB_ADMIN_USER
    value: "sinusoidal-admin"
  - name: INFLUXDB_ADMIN_PASSWORD
    value: "sinusoidal-password"
  - name: SERVICE_NAME
    value: "sinusoidal-database"
  - name: LOG_LEVEL
    value: "INFO"

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# Network Policy (disabled by default)
networkPolicy:
  enabled: false
  ingress: []
  egress: []