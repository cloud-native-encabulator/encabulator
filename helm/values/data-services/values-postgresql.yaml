# PostgreSQL configuration for Hydrocoptic DataStore backend
# Cloud Native Encabulator - Data Plane
# Uses groundhog2k/postgres chart with official postgres image

# Image configuration (uses official postgres image)
image:
  registry: "docker.io"
  repository: "postgres"
  tag: "17"
  pullPolicy: IfNotPresent

# Resources
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Database configuration
settings:
  superuserPassword:
    value: "encabulator-dev-password"

# User database
userDatabase:
  name:
    value: "hydrocoptic_db"
  user:
    value: "hydrocoptic"
  password:
    value: "hydrocoptic-password"

# Additional environment variables to ensure proper setup
env:
  - name: POSTGRES_PASSWORD
    value: "encabulator-dev-password"
  - name: POSTGRES_DB
    value: "hydrocoptic_db"
  - name: POSTGRES_USER
    value: "hydrocoptic"

# Storage configuration
storage:
  requestedSize: "8Gi"
  # Use default storage class
  className: ""

# Service configuration
service:
  type: ClusterIP
  port: 5432

# Security context (already configured in chart)
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsGroup: 999
  runAsUser: 999

# Health checks
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 10

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  periodSeconds: 10

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# Custom labels
customLabels:
  app.kubernetes.io/part-of: "cloud-native-encabulator"
  app.kubernetes.io/component: "hydrocoptic-datastore-backend"