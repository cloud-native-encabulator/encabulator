# Redis configuration for Prefabulated Cache
# Cloud Native Encabulator - Data Plane
# Uses groundhog2k/redis chart with official redis image

# Image configuration (uses official redis image)
image:
  registry: "docker.io"
  repository: "redis"
  tag: "8"
  pullPolicy: IfNotPresent

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Storage configuration
storage:
  requestedSize: "4Gi"
  # Use default storage class
  className: ""

# Service configuration
service:
  type: ClusterIP
  serverPort: 6379

# Security context (already configured in chart)
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999

# Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels: {}
    annotations: {}
    interval: 30s

# Health checks
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 10

livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  periodSeconds: 10

# Pod Disruption Budget
podDisruptionBudget:
  minAvailable: 1

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# Custom labels
customLabels:
  app.kubernetes.io/part-of: "cloud-native-encabulator"
  app.kubernetes.io/component: "prefabulated-cache"

# Redis configuration
redisConfig: |
  # Basic Redis configuration for Prefabulated Cache
  # Enable persistence
  save 900 1
  save 300 10
  save 60 10000
  
  # Memory management
  maxmemory-policy allkeys-lru
  
  # Security
  protected-mode yes