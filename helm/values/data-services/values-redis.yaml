# Redis configuration for Prefabulated Cache
# Cloud Native Encabulator - Data Plane

# Authentication
auth:
  enabled: true
  password: "prefabulated-cache-password"

# Architecture - single master for development
architecture: standalone

# Master configuration
master:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Persistence
  persistence:
    enabled: true
    size: 4Gi
    # Use default storage class
    # storageClass: ""

# Disable replica for development
replica:
  replicaCount: 0

# Service configuration
service:
  type: ClusterIP
  ports:
    redis: 6379

# Security context
securityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s

# Pod Disruption Budget
pdb:
  create: true
  minAvailable: 1

# Network Policy (disabled by default)
networkPolicy:
  enabled: false
  allowExternal: true
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# Common labels
commonLabels:
  app.kubernetes.io/part-of: "cloud-native-encabulator"
  app.kubernetes.io/component: "prefabulated-cache"