# ArgoCD Helm Values - Development Environment
# Chart: argo/argo-cd
# Repository: https://argoproj.github.io/argo-helm

global:
  # Use specific image tag for consistency
  image:
    tag: "v2.8.4"

# ArgoCD Server Configuration
server:
  # Enable insecure mode for development (no TLS)
  insecure: true
  
  # Service configuration
  service:
    type: ClusterIP
    
  # Ingress configuration (disabled for development)
  ingress:
    enabled: false
    
  # Additional server configuration
  config:
    # Enable anonymous access for development
    "users.anonymous.enabled": "false"
    
    # Repository configuration
    repositories: |
      - type: git
        url: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
        name: encabulator-repo
        
    # Application configuration
    application.instanceLabelKey: argocd.argoproj.io/instance

# ArgoCD Repository Server
repoServer:
  # Resource limits for development
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ArgoCD Application Controller
controller:
  # Resource limits for development
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      
  # Metrics configuration
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"

# ArgoCD Dex (OIDC) - Disabled for development
dex:
  enabled: false

# ArgoCD Notifications Controller
notifications:
  enabled: false

# ArgoCD Application Set Controller
applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Redis (ArgoCD dependency)
redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# RBAC Configuration
configs:
  rbac:
    # Default policy for development
    policy.default: role:readonly
    
    # Admin policy
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      g, argocd-admins, role:admin

  # Initial repositories
  repositories:
    encabulator-repo:
      url: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
      type: git
      name: encabulator-repo

# Projects configuration
projects:
  - name: infrastructure
    description: "Cloud Native Encabulator Infrastructure"
    sourceRepos:
      - "https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git"
      - "https://argoproj.github.io/argo-helm"
      - "https://aws-controllers-k8s.github.io/*"
      - "https://prometheus-community.github.io/helm-charts"
      - "https://grafana.github.io/helm-charts"
      - "https://jaegertracing.github.io/helm-charts"
    destinations:
      - namespace: "*"
        server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
        
  - name: platform
    description: "Cloud Native Encabulator Platform Services"
    sourceRepos:
      - "https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git"
    destinations:
      - namespace: "encabulator-*"
        server: "https://kubernetes.default.svc"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
        
  - name: applications
    description: "Cloud Native Encabulator Applications"
    sourceRepos:
      - "https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git"
    destinations:
      - namespace: "encabulator-*"
        server: "https://kubernetes.default.svc"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"