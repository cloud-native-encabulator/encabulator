# Prometheus Helm Values for Cloud Native Encabulator
# Using the official Prometheus Community Helm Chart

# Global settings
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: cloud-native-encabulator
    environment: development

# Prometheus server configuration
prometheus:
  prometheusSpec:
    # Resource management (increased to trigger EKS Auto Mode node provisioning)
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    
    # Storage configuration - uses default storage class
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          # No explicit storageClassName - uses cluster default
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    
    # Service discovery and scraping
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
    # Additional scrape configs for Cloud Native Encabulator
    additionalScrapeConfigs:
      - job_name: 'data-services'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - encabulator-data
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: (postgresql|redis)
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
      
      - job_name: 'encabulator-services'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

# Grafana configuration
grafana:
  enabled: true
  adminPassword: encabulator-dev-2024
  
  # Grafana resources (increased to ensure adequate resources)
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  # Persistence - uses default storage class
  persistence:
    enabled: true
    # No explicit storageClassName - uses cluster default
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  
  # Security context for better compatibility
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  
  # Service configuration
  service:
    type: ClusterIP
    port: 80
  
  # Datasources (automatically configured by kube-prometheus-stack)
  # The chart automatically creates a Prometheus datasource
  
  # Dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'encabulator'
        orgId: 1
        folder: 'Cloud Native Encabulator'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/encabulator
  
  dashboards:
    encabulator:
      encabulator-overview:
        gnetId: 15757  # Kubernetes cluster monitoring dashboard
        revision: 1
        datasource: Prometheus

# AlertManager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
    # Storage configuration - uses default storage class
    # Comment out storage section to disable persistence if PVC issues occur
    storage:
      volumeClaimTemplate:
        spec:
          # No explicit storageClassName - uses cluster default
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# Node Exporter
nodeExporter:
  enabled: true

# Kube State Metrics
kubeStateMetrics:
  enabled: true

# Service monitors for automatic discovery
serviceMonitor:
  enabled: true
  
# Default rules for Kubernetes monitoring (EKS-compatible)
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # Not accessible in EKS
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: false  # Not accessible in EKS
    kubeApiserverAvailability: false  # Not accessible in EKS
    kubeApiserverSlos: false  # Not accessible in EKS
    kubelet: true
    kubeProxy: false  # Not accessible in EKS
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Disable control plane monitoring for EKS
kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false