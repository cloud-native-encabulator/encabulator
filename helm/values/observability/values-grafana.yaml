# Grafana Helm Values for Cloud Native Encabulator
# Using the official Grafana Helm Chart

# Admin credentials
adminUser: admin
adminPassword: encabulator-dev-2024

# Resource management
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 512Mi

# Persistence
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""  # Use default storage class

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Ingress (disabled by default)
ingress:
  enabled: false

# Datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-server:80
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 30s
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      jsonData:
        maxLines: 1000

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'encabulator-infrastructure'
      orgId: 1
      folder: 'Infrastructure'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/infrastructure
    - name: 'encabulator-services'
      orgId: 1
      folder: 'Services'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/services
    - name: 'encabulator-aws'
      orgId: 1
      folder: 'AWS Resources'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/aws

# Pre-configured dashboards
dashboards:
  infrastructure:
    kubernetes-cluster:
      gnetId: 15757
      revision: 1
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 15760
      revision: 1
      datasource: Prometheus
    node-exporter:
      gnetId: 1860
      revision: 27
      datasource: Prometheus
  
  services:
    encabulator-overview:
      json: |
        {
          "dashboard": {
            "id": null,
            "title": "Cloud Native Encabulator Overview",
            "tags": ["encabulator"],
            "timezone": "browser",
            "panels": [
              {
                "id": 1,
                "title": "Encabulator Services Status",
                "type": "stat",
                "targets": [
                  {
                    "expr": "up{job=~\".*encabulator.*\"}",
                    "legendFormat": "{{instance}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
              }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "30s"
          }
        }
  
  aws:
    rds-overview:
      json: |
        {
          "dashboard": {
            "id": null,
            "title": "RDS Database Metrics",
            "tags": ["aws", "rds"],
            "timezone": "browser",
            "panels": [
              {
                "id": 1,
                "title": "Database Connections",
                "type": "graph",
                "targets": [
                  {
                    "expr": "aws_rds_database_connections",
                    "legendFormat": "{{db_instance_identifier}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
              }
            ],
            "time": {"from": "now-1h", "to": "now"},
            "refresh": "30s"
          }
        }

# Plugins
plugins:
  - grafana-piechart-panel
  - grafana-worldmap-panel

# Environment variables
env:
  GF_EXPLORE_ENABLED: true
  GF_ALERTING_ENABLED: true
  GF_UNIFIED_ALERTING_ENABLED: true

# Security settings
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

# Sidecar for automatic dashboard discovery
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    folder: /tmp/dashboards
    searchNamespace: ALL
  datasources:
    enabled: true
    label: grafana_datasource
    searchNamespace: ALL