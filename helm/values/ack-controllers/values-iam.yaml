# ACK IAM Controller Helm Values
# Configuration for AWS Controllers for Kubernetes - IAM Service

# AWS Configuration
aws:
  # AWS region where resources will be managed
  region: us-west-2

# Service Account configuration for IRSA
serviceAccount:
  # Annotations for IAM role association
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ack-iam-controller
  name: ack-iam-controller

# Controller configuration
controller:
  # Resource limits and requests
  resources:
    limits:
      cpu: 100m
      memory: 300Mi
    requests:
      cpu: 50m
      memory: 200Mi
  
  # Environment variables
  env:
    - name: ACK_SYSTEM_NAMESPACE
      value: ack-system
    - name: ACK_WATCH_NAMESPACE
      value: ""  # Watch all namespaces
    - name: ACK_LOG_LEVEL
      value: "INFO"
    - name: ACK_RESOURCE_TAGS
      value: "Environment=development,Project=cloud-native-encabulator"

# Metrics configuration
metrics:
  service:
    # Enable metrics endpoint
    create: true
    type: ClusterIP
    port: 8080

# RBAC configuration
rbac:
  create: true

# Pod Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Image configuration
image:
  repository: public.ecr.aws/aws-controllers-k8s/iam-controller
  tag: v0.0.15
  pullPolicy: IfNotPresent

# Deployment configuration
deployment:
  annotations: {}
  labels: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Webhook configuration (if applicable)
webhook:
  enabled: false