# Namespace configuration
namespace: encabulator-processing
createNamespace: false

replicaCount: 2

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/logarithmic-casing-service
  pullPolicy: Always
  tag: "0.0.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env:
  - name: NATS_URL
    value: "nats://logarithmic-casing-service-nats:4222"

nodeSelector: {}

tolerations: []

affinity: {}

# NATS subchart configuration
nats:
  nats:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 2Gi
      fileStorage:
        enabled: true
        size: 10Gi
  cluster:
    enabled: false
  replicaCount: 1
