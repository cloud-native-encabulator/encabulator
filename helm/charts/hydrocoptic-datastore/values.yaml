# Namespace configuration
namespace: encabulator-data
createNamespace: false

replicaCount: 2

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/hydrocoptic-datastore
  pullPolicy: Always
  tag: "0.0.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

database:
  host: hydrocoptic-postgresql
  port: 5432
  name: hydrocoptic_db
  user: hydrocoptic
  passwordSecret: hydrocoptic-postgresql
  passwordKey: POSTGRES_PASSWORD

env: []

nodeSelector: {}

tolerations: []

affinity: {}
