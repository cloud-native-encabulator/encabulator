replicaCount: 2

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/side-fumbling-collector
  pullPolicy: Always
  tag: "0.0.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env:
  - name: PORT
    value: "8080"
  - name: IN_CLUSTER
    value: "true"
  - name: NAMESPACE
    value: "encabulator-support"

nodeSelector: {}

tolerations: []

affinity: {}
