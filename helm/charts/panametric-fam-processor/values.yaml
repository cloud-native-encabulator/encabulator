# Namespace configuration
namespace: encabulator-processing
createNamespace: false

replicaCount: 3

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/panametric-fam-processor
  pullPolicy: Always
  tag: "0.2.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1  # Reduced from 3 for dev/demo environments
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 10

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"
  - name: HYDROCOPTIC_URL
    value: "http://hydrocoptic-datastore.encabulator-data.svc.cluster.local:8080"
  - name: CACHE_URL
    value: "http://prefabulated-cache.encabulator-data.svc.cluster.local:8080"
  - name: SINUSOIDAL_URL
    value: "http://sinusoidal-database.encabulator-data.svc.cluster.local:8080"

nodeSelector: {}

tolerations: []

affinity: {}
