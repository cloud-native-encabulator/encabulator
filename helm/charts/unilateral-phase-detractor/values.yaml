# Namespace configuration
namespace: encabulator-support
createNamespace: false

replicaCount: 3

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/unilateral-phase-detractor
  pullPolicy: Always
  tag: "0.0.1"

# Secret key for JWT token signing - should be overridden in production
secretKey: "change-this-in-production-use-helm-secrets-or-external-secrets"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env:
  - name: PORT
    value: "8080"
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: unilateral-phase-detractor-secrets
        key: secret-key

nodeSelector: {}

tolerations: []

affinity: {}
