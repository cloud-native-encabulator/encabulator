# Namespace configuration
namespace: encabulator-support
createNamespace: false

replicaCount: 2

image:
  repository: 510431938379.dkr.ecr.us-east-2.amazonaws.com/encabulator/differential-girdle
  pullPolicy: Always
  tag: "0.0.1"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env: []

nodeSelector: {}

tolerations: []

affinity: {}
