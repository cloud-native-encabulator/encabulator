{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hydrocoptic-datastore.fullname" . }}
  labels:
    {{- include "hydrocoptic-datastore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hydrocoptic-datastore.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from other services in the same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Allow monitoring traffic
    - from:
        - namespaceSelector:
            matchLabels:
              name: encabulator-monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow connection to PostgreSQL
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ include "hydrocoptic-datastore.fullname" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    # Allow connection to external database
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.externalDatabase.port }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}