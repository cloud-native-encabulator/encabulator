{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hydrocoptic-datastore.fullname" . }}-credentials
  labels:
    {{- include "hydrocoptic-datastore.labels" . | nindent 4 }}
type: Opaque
data:
  # PostgreSQL connection details
  postgres-host: {{ printf "%s-postgresql" (include "hydrocoptic-datastore.fullname" .) | b64enc | quote }}
  postgres-port: {{ "5432" | b64enc | quote }}
  postgres-database: {{ .Values.postgresql.auth.database | b64enc | quote }}
  postgres-username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  
  # Service connection string
  database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "hydrocoptic-datastore.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hydrocoptic-datastore.fullname" . }}-credentials
  labels:
    {{- include "hydrocoptic-datastore.labels" . | nindent 4 }}
type: Opaque
data:
  # External database connection details
  postgres-host: {{ .Values.externalDatabase.host | b64enc | quote }}
  postgres-port: {{ .Values.externalDatabase.port | toString | b64enc | quote }}
  postgres-database: {{ .Values.externalDatabase.database | b64enc | quote }}
  postgres-username: {{ .Values.externalDatabase.username | b64enc | quote }}
  postgres-password: {{ .Values.externalDatabase.password | b64enc | quote }}
  
  # Service connection string
  database-url: {{ printf "postgresql://%s:%s@%s:%d/%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host (.Values.externalDatabase.port | int) .Values.externalDatabase.database | b64enc | quote }}
{{- end }}