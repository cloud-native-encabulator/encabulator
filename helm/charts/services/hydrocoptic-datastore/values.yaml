# Default values for hydrocoptic-datastore
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Image configuration
image:
  registry: docker.io
  repository: encabulator/hydrocoptic-datastore
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# Deployment configuration
replicaCount: 2

# Resource management
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 1000

# Environment variables
env:
  - name: SERVICE_NAME
    value: "hydrocoptic-datastore"
  - name: LOG_LEVEL
    value: "INFO"
  - name: METRICS_PORT
    value: "8080"

# ConfigMap data
config:
  database:
    maxConnections: 100
    connectionTimeout: 30s
    queryTimeout: 60s
  cache:
    enabled: true
    ttl: 300s
  logging:
    level: INFO
    format: json

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# PostgreSQL dependency configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "encabulator-dev-password"
    username: "hydrocoptic"
    password: "hydrocoptic-password"
    database: "hydrocoptic_db"
  primary:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# External database configuration (when postgresql.enabled = false)
externalDatabase:
  host: ""
  port: 5432
  username: "hydrocoptic"
  password: ""
  database: "hydrocoptic_db"
  existingSecret: ""
  existingSecretPasswordKey: ""

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s