# AWS Resources managed via ACK Custom Resources
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-resources
  namespace: argocd
  labels:
    app.kubernetes.io/name: aws-resources
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/infrastructure/aws-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  info:
    - name: Description
      value: "AWS resources for Cloud Native Encabulator managed via ACK Custom Resources"
    - name: Resources
      value: "PostgreSQL (Hydrocoptic Data Store), Redis (Prefabulated Cache), IAM Roles"
