# ACK RDS Controller via Helm
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-rds-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: ack-rds-controller
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: oci://public.ecr.aws/aws-controllers-k8s/rds-chart
    targetRevision: v0.0.25
    helm:
      valueFiles:
        - $values/helm/values/ack-controllers/values-rds.yaml
  sources:
    - repoURL: oci://public.ecr.aws/aws-controllers-k8s/rds-chart
      targetRevision: v0.0.25
    - repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ack-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "AWS Controllers for Kubernetes - RDS"
    - name: Chart Version
      value: "v0.0.25"
    - name: AWS Service
      value: "Amazon RDS"

