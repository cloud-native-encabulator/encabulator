# AWS Controllers for Kubernetes (ACK) - RDS Controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-rds-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: ack-rds-controller
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: oci://public.ecr.aws/aws-controllers-k8s
    chart: rds-chart
    targetRevision: "1.2.11"
    helm:
      releaseName: ack-rds-controller
      values: |
        aws:
          region: us-east-2
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ack-rds-controller
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 50m
            memory: 200Mi
        log:
          level: info
        resourceTags:
          - ManagedBy=ACK
          - Project=cloud-native-encabulator
  destination:
    server: https://kubernetes.default.svc
    namespace: ack-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

