# Kube Resource Orchestrator (KRO) Installation
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro-installation
  namespace: argocd
  labels:
    app.kubernetes.io/name: kro-installation
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/infrastructure/kro/kro-installation
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Kube Resource Orchestrator (KRO) controller installation"
    - name: Purpose
      value: "Creates custom APIs for complex multi-resource deployments"

---
# KRO ResourceGroups - Custom API Definitions
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro-resource-groups
  namespace: argocd
  labels:
    app.kubernetes.io/name: kro-resource-groups
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/infrastructure/kro/resource-groups
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "KRO ResourceGroup definitions for Cloud Native Encabulator"
    - name: APIs
      value: "EncabulatorDatabase, EncabulatorCache, EncabulatorCluster"
# - Handle resource dependencies and creation ordering automatically
# - Generate CRDs and controllers dynamically from ResourceGroup definitions
#
# Example KRO ResourceGroup for EncabulatorDatabase:
# apiVersion: kro.run/v1alpha1
# kind: ResourceGroup
# metadata:
#   name: encabulator-database-rg
#   namespace: kro-system
# spec:
#   schema:
#     apiVersion: v1alpha1
#     kind: EncabulatorDatabase
#     spec:
#       name: string
#       engine: string | default="postgres"
#       instanceClass: string | default="db.t3.micro"
#   resources:
#     - id: rds-instance
#       template:
#         apiVersion: rds.services.k8s.aws/v1alpha1
#         kind: DBInstance
#         # ... RDS configuration
#     - id: security-group
#       template:
#         apiVersion: ec2.services.k8s.aws/v1alpha1
#         kind: SecurityGroup
#         # ... Security group configuration

---
# Vertical Pod Autoscaler (VPA) for right-sizing
# Complements KRO with automatic resource request/limit adjustments
# Example VPA configuration:
# apiVersion: autoscaling.k8s.io/v1
# kind: VerticalPodAutoscaler
# metadata:
#   name: encabulator-data-vpa
#   namespace: encabulator-data
# spec:
#   targetRef:
#     apiVersion: apps/v1
#     kind: StatefulSet
#     name: postgres
#   updatePolicy:
#     updateMode: "Auto"
#   resourcePolicy:
#     containerPolicies:
#     - containerName: postgres
#       maxAllowed:
#         cpu: 2
#         memory: 4Gi
#       minAllowed:
#         cpu: 100m
#         memory: 128Mi

---
