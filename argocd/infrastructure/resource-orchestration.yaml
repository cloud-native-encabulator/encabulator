# AWS Resources via ACK Controllers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-resources
  namespace: argocd
  labels:
    app.kubernetes.io/name: aws-resources
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/infrastructure/aws-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "AWS resources managed by ACK controllers"
    - name: Resources
      value: "RDS Database, ElastiCache Redis cluster"