#   maxReplicaCount: 20
#   triggers:
#   - type: prometheus
#     metadata:
#       serverAddress: http://prometheus.encabulator-monitoring:9090
#       metricName: nats_pending_messages
#       threshold: '10'
#       query: sum(nats_stream_pending_messages{stream="encabulator-events"})

---
# Note: EKS Auto Mode handles node management automatically
# No need for Karpenter or manual node group configuration
# EKS Auto Mode provides:
# - Automatic node provisioning and scaling
# - Optimal instance type selection
# - Spot instance integration
# - Cost optimization
# - Zero-touch node management
