# Prometheus Stack via Helm Chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus-stack
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 51.3.0  # kube-prometheus-stack chart version
    chart: kube-prometheus-stack
    helm:
      valueFiles:
        - $values/helm/values/observability/values-prometheus.yaml
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 51.3.0
      chart: kube-prometheus-stack
    - repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Complete Prometheus monitoring stack via Helm"
    - name: Chart
      value: "kube-prometheus-stack v51.3.0"
    - name: Components
      value: "Prometheus, Grafana, AlertManager, Node Exporter"

# Note: Grafana is included in the kube-prometheus-stack above
# No standalone Grafana deployment needed