# Observability ResourceGroups - KRO Custom API Definitions
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-resource-groups
  namespace: argocd
  labels:
    app.kubernetes.io/name: observability-resource-groups
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/platform/observability/resource-groups
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "KRO ResourceGroup definitions for observability stack"
    - name: APIs
      value: "ObservabilityMetrics, ObservabilityTracing, ObservabilityLogs, ObservabilityStack"

---
# Observability Stack Instance - Deploy the actual monitoring
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/platform/observability/instances
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Cloud Native Encabulator observability stack deployment"
    - name: Components
      value: "Prometheus, Grafana, Jaeger, Loki via KRO custom resources"