# Observability Namespace
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-namespace
  namespace: argocd
  labels:
    app.kubernetes.io/name: observability-namespace
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/platform/observability
    directory:
      include: "namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  info:
    - name: Description
      value: "Observability namespace for monitoring components"

---
# Prometheus Monitoring Stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus-monitoring
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: k8s/platform/observability/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Prometheus monitoring stack for Cloud Native Encabulator"
    - name: Components
      value: "Prometheus server with Kubernetes service discovery"