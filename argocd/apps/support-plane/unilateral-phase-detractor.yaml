apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unilateral-phase-detractor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jlbutler/cloud-native-encabulator.git
    targetRevision: HEAD
    path: helm/charts/unilateral-phase-detractor
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-support
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
