apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prefabulated-cache
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jlbutler/cloud-native-encabulator.git
    targetRevision: HEAD
    path: helm/charts/prefabulated-cache
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
