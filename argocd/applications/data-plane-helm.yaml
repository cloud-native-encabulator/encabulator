# Hydrocoptic Data Store via Helm Chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydrocoptic-datastore
  namespace: argocd
  labels:
    app.kubernetes.io/name: hydrocoptic-datastore
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/managed-by: argocd
spec:
  project: applications
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_ORG/cloud-native-encabulator-microservices.git
    targetRevision: HEAD
    path: helm/charts/hydrocoptic-datastore
    helm:
      valueFiles:
        - values.yaml
      values: |
        # Environment-specific overrides
        replicaCount: 2
        
        # Use external RDS database instead of embedded PostgreSQL
        postgresql:
          enabled: false
        
        externalDatabase:
          host: "hydrocoptic-datastore.cluster-xyz.us-west-2.rds.amazonaws.com"
          port: 5432
          username: "encabulator_admin"
          database: "hydrocoptic_db"
          existingSecret: "hydrocoptic-datastore-credentials"
          existingSecretPasswordKey: "password"
        
        # Monitoring configuration
        monitoring:
          serviceMonitor:
            enabled: true
            namespace: "encabulator-monitoring"
        
        # Resource configuration for development
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        
        # Autoscaling for development
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Hydrocoptic Data Store microservice via Helm"
    - name: Chart
      value: "hydrocoptic-datastore v0.1.0"
    - name: Database
      value: "External RDS PostgreSQL"

---
# Sinusoidal Database via Helm Chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sinusoidal-database
  namespace: argocd
  labels:
    app.kubernetes.io/name: sinusoidal-database
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/managed-by: argocd
spec:
  project: applications
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 23.1.0
    chart: prometheus
    helm:
      values: |
        # Sinusoidal Database implemented as Prometheus TSDB
        server:
          name: sinusoidal-database
          
          # Resource configuration
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          
          # Storage configuration
          persistentVolume:
            enabled: true
            size: 5Gi
          
          # Retention configuration
          retention: "7d"
          
          # Service configuration
          service:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9090"
              encabulator.io/service: "sinusoidal-database"
        
        # Disable components we don't need
        alertmanager:
          enabled: false
        kubeStateMetrics:
          enabled: false
        nodeExporter:
          enabled: false
        pushgateway:
          enabled: false
        
        # Configure for time-series data
        serverFiles:
          prometheus.yml:
            global:
              scrape_interval: 15s
              evaluation_interval: 15s
            scrape_configs:
            - job_name: 'sinusoidal-metrics'
              static_configs:
              - targets: ['localhost:9090']
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Sinusoidal Database (Time-series) via Prometheus Helm chart"
    - name: Chart
      value: "prometheus v23.1.0"
    - name: Storage
      value: "Time-series database for metrics"

---
# Prefabulated Cache via Redis Helm Chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prefabulated-cache
  namespace: argocd
  labels:
    app.kubernetes.io/name: prefabulated-cache
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/managed-by: argocd
spec:
  project: applications
  source:
    repoURL: https://charts.redis.io/
    targetRevision: 19.6.0
    chart: redis
    helm:
      values: |
        # Prefabulated Cache configuration
        global:
          redis:
            password: "prefabulated-cache-password"
        
        # Architecture configuration
        architecture: standalone
        
        # Auth configuration
        auth:
          enabled: true
          password: "prefabulated-cache-password"
        
        # Master configuration
        master:
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          
          # Persistence
          persistence:
            enabled: true
            size: 2Gi
          
          # Service configuration
          service:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9121"
              encabulator.io/service: "prefabulated-cache"
        
        # Metrics configuration
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            namespace: "encabulator-monitoring"
          
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
        
        # Disable replica for development
        replica:
          replicaCount: 0
        
        # Network policy
        networkPolicy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: encabulator-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: Description
      value: "Prefabulated Cache via Redis Helm chart"
    - name: Chart
      value: "redis v18.1.5"
    - name: Architecture
      value: "Standalone Redis with metrics"