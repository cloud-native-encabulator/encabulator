name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      argocd: ${{ steps.changes.outputs.argocd }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            services:
              - 'services/**'
            argocd:
              - 'argocd/**'
              - 'scripts/**'
            docs:
              - 'docs/**'
              - '*.md'

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          # Install shellcheck
          sudo apt-get update && sudo apt-get install -y shellcheck

          # Lint shell scripts
          find scripts -name "*.sh" -exec shellcheck {} \; || echo "No shell scripts found or shellcheck issues"

      - name: Lint YAML files
        run: |
          # Install yamllint
          pip install yamllint

          # Lint ArgoCD and other YAML files
          find argocd -name "*.yaml" -o -name "*.yml" | xargs yamllint || echo "No YAML files found"

      - name: Validate Markdown
        run: |
          # Install markdownlint
          npm install -g markdownlint-cli

          # Lint markdown files
          find . -name "*.md" -not -path "./.git/*" | xargs markdownlint || echo "No markdown issues found"

  validate-argocd:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.argocd == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubernetes tools
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate ArgoCD manifests
        run: |
          # Validate ArgoCD application manifests
          find argocd -name "*.yaml" -o -name "*.yml" | xargs -I {} kubectl --dry-run=client apply -f {}

      - name: Test kustomize builds
        run: |
          # Test kustomize builds for each component
          for dir in argocd/*/; do
            if [ -f "$dir/kustomization.yaml" ]; then
              echo "Testing kustomize build for $dir"
              kustomize build "$dir" > /dev/null
            fi
          done

  # Container builds will be added when services are implemented
  # This job is a placeholder for future service container builds
  prepare-for-services:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder for service builds
        run: |
          echo "Service builds will be implemented when services are created"
          echo "This will include:"
          echo "- Multi-language service testing (Go, Node.js, Python)"
          echo "- Container image building and pushing"
          echo "- Service-specific linting and validation"

  validate-scripts:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.argocd == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Test setup scripts
        run: |
          # Test that scripts are executable and have basic syntax validation
          find scripts -name "*.sh" -exec bash -n {} \;

      - name: Validate script permissions
        run: |
          # Check that scripts have proper execute permissions
          find scripts -name "*.sh" ! -executable -exec echo "Missing execute permission: {}" \;

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
